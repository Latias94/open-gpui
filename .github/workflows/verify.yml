name: Verify

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1

jobs:
  msrv-windows:
    name: msrv (windows, Rust 1.93)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install minimum Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check framework on minimum Rust
        run: cargo +1.93.0 check --locked -p open-gpui -p open-gpui-wgpu -p open-gpui-windows -p open-gpui-canvas -p open-gpui-platform -p open-gpui-bench-metrics -p open-gpui-macros -p open-gpui-motion -p open-gpui-ui-core -p open-gpui-ui-components --all-features --all-targets -j 1

      - name: Check independent test-support consumer on minimum Rust
        run: cargo +1.93.0 check --locked --manifest-path tests/fixtures/test-support-consumer/Cargo.toml --all-targets --all-features --target-dir target -j 1

      - name: Check hot-reload consumer on minimum Rust
        run: cargo +1.93.0 check --locked --manifest-path tests/fixtures/hot-reload-consumer/Cargo.toml --all-targets --target-dir target -j 1

  msrv-docking-windows:
    name: msrv (windows, docking and tooling, Rust 1.95)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install docking minimum Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check docking, examples, and tooling on minimum Rust
        run: cargo +1.95.0 check --locked -p open-gpui-devtools -p open-gpui-docking -p open-gpui-docking-minimal -p open-gpui-docking-multiviewport -p open-gpui-docking-native -p open-gpui-dockspace-editor -p open-gpui-ui-foundation-gallery -p xtask --all-features --all-targets -j 1

      - name: Check independent consumer on docking minimum Rust
        run: cargo +1.95.0 check --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --all-targets --all-features --target-dir target -j 1

  quality:
    name: verify workspace and libraries (windows)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GPUI_LEAK_DETECTION: '1'
      GPUI_TEST_EXPECT_LEAK_DETECTION: 'on'

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting and workspace targets
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --workspace --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check -p open-gpui-smoke-native --locked

      - name: Test default Core without additive support
        run: cargo nextest run --locked -p open-gpui --lib --tests --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test default libraries and default docking
        run: cargo nextest run --locked -p open-gpui-motion -p open-gpui-form -p open-gpui-resource -p open-gpui-devtools -p open-gpui-ui-core -p open-gpui-ui-components -p open-gpui-ui-foundation-gallery -p open-gpui-docking --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test complete libraries and legacy docking
        run: cargo nextest run --locked -p open-gpui-form -p open-gpui-resource -p open-gpui-devtools -p open-gpui-ui-core -p open-gpui-ui-components -p open-gpui-ui-foundation-gallery -p open-gpui-docking -p open-gpui-docking-native -p open-gpui-canvas -p open-gpui-command -p open-gpui-bench-metrics -p open-gpui-macros -p xtask --all-features --lib --tests --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test public library documentation
        run: cargo test --locked -p open-gpui-motion -p open-gpui-devtools -p open-gpui-ui-core -p open-gpui-ui-components --all-features --doc

      - name: Check repository contracts
        run: |
          cargo run --locked -p xtask -- verify-release-docs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p xtask -- scan-doc-links
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p xtask -- scan-theme-drift
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p xtask -- scan-theme-schema
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p xtask -- scan-import-boundary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p xtask -- scan-public-api --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p xtask -- scan-ui-contract

      - name: Test release embedded assets
        run: cargo nextest run --locked -p open-gpui-util --release --test embedded_assets --test-threads=1 --no-fail-fast --no-tests fail

  verify:
    name: verify (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
          - name: macos
            os: macos-15
          - name: windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev dbus libfontconfig1-dev libfreetype6-dev libpipewire-0.3-dev libwayland-dev libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev xvfb pkg-config

      - name: Test complete Core and utility contracts
        run: cargo nextest run --locked -p open-gpui -p open-gpui-scheduler -p open-gpui-motion -p open-gpui-core-util -p open-gpui-util -p open-gpui-path -p open-gpui-log -p open-gpui-sum-tree -p open-gpui-reqwest-client -p open-gpui-github-releases --all-features --lib --tests --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test Core without optional instrumentation
        run: cargo nextest run --locked -p open-gpui --no-default-features --features test-support --lib --tests --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test hot reload without default features
        run: cargo nextest run --locked -p open-gpui --no-default-features --features test-support,hot-reload --lib -E 'test(hot_reload::)' --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test host Web sessions and font fallback
        run: cargo nextest run --locked -p open-gpui-web -p open-gpui-wgpu --lib -E 'package(open-gpui-web) | test(glyph_cache::) | test(run_replacements::) | test(text_edit::) | test(cosmic_text_system::font_installation_tests::)' --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test component platform and motion consumers
        run: cargo nextest run --locked -p open-gpui-command -p open-gpui-ui-components -p open-gpui-docking --all-features --lib --test runtime_keybindings --test app_motion -E 'test(app_reduced_) | test(app_motion_) | test(list_theme_reduced_) | binary(runtime_keybindings) | binary(app_motion)' --test-threads=1 --no-fail-fast --no-tests fail

      - name: Check Linux backend feature boundaries
        if: matrix.name == 'linux'
        run: |
          cargo check --locked -p open-gpui-linux --all-features
          cargo check --locked -p open-gpui-linux --no-default-features --features wayland --lib
          cargo check --locked -p open-gpui-linux --no-default-features --features x11 --lib
          cargo check --locked -p open-gpui-platform --no-default-features --features x11,wayland --example toggle_headless

      - name: Test Linux backends and headless activity
        if: matrix.name == 'linux'
        run: |
          cargo nextest run --locked -p open-gpui-linux --all-features --lib --tests --test-threads=1 --no-fail-fast --no-tests fail
          cargo nextest run --locked -p open-gpui-linux --no-default-features --lib -E 'test(headless_idle_sleep_prevention_is_unsupported)' --test-threads=1 --no-fail-fast --no-tests fail
          cargo nextest run --locked -p open-gpui-linux --no-default-features --features x11,wayland,test-support --lib -E 'test(/^linux::x11::clipboard::native_windowing_tests::/)' --run-ignored only --test-threads=1 --no-fail-fast --no-tests fail

      - name: Check macOS backends and native examples
        if: matrix.name == 'macos'
        run: |
          cargo check --locked -p open-gpui-apple -p open-gpui-macos --all-features --all-targets
          cargo check --locked -p open-gpui-platform --all-features --example svg_animation

      - name: Test Apple and macOS offline Metal backends
        if: matrix.name == 'macos'
        run: cargo nextest run --locked -p open-gpui-apple -p open-gpui-macos --features font-kit,screen-capture --lib --tests --test-threads=1 --no-fail-fast --no-tests fail

      - name: Check native WGPU font-kit path
        run: cargo check --locked -p open-gpui-wgpu --features font-kit

  consumers:
    name: verify consumers (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
          - name: macos
            os: macos-15
          - name: windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libfontconfig1-dev libfreetype6-dev libpipewire-0.3-dev libwayland-dev libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev pkg-config

      - name: Check independently locked consumer targets
        run: cargo check --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --all-targets --all-features --target-dir target

      - name: Check independent test-support targets
        run: cargo check --locked --manifest-path tests/fixtures/test-support-consumer/Cargo.toml --all-targets --all-features --target-dir target

      - name: Test independent API without optional features
        run: cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --no-default-features --tests --target-dir target --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test independent benchmark API without test support
        run: cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --no-default-features --features bench-support,profiler --tests --target-dir target --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test complete independent API
        run: cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --all-features --tests -E 'not binary(wgpu_atlas)' --target-dir target --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test independent logging without Tracy
        run: cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --no-default-features --features logging --test logging --target-dir target --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test minimal optional feature boundaries
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --no-default-features --features profiler --test debug_overlay --test send_foreground --target-dir target --test-threads=1 --no-fail-fast --no-tests fail
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --no-default-features --features avif-encoding --test images --target-dir target --test-threads=1 --no-fail-fast --no-tests fail
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --no-default-features --features debug-embed --test utility_support --target-dir target --test-threads=1 --no-fail-fast --no-tests fail
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --no-default-features --features logging-tracy --test logging --target-dir target --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test independent support and dedicated execution
        run: cargo nextest run --locked --manifest-path tests/fixtures/test-support-consumer/Cargo.toml --features bench-support --tests --target-dir target --test-threads=1 --no-fail-fast --no-tests fail

      - name: Run independent and platform benchmark smoke
        if: matrix.name == 'windows'
        shell: pwsh
        env:
          GPUI_LEAK_DETECTION: ''
          BENCH_MEASUREMENT: wall-time
        run: |
          cargo bench --locked --profile dev --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --features bench-support --bench maintained_harness --target-dir target -- --noplot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:SEED = '0'
          $env:ITERATIONS = '1'
          cargo bench --locked --profile dev -p open-gpui-platform --features bench-support,open_gpui/stacker --bench randomized_element_tree -- --test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:SEED = $null
          cargo bench --locked --profile dev --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --features bench-support --bench randomized_tree --target-dir target -- --test

  native-windows:
    name: verify native (windows)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2

      - name: Test production FXC sprite entries
        run: cargo nextest run --locked -p open-gpui-windows --all-features --lib -E 'test(=directx_renderer::shader_resources::tests::sprite_shader_entry_points_compile_with_fxc)' --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test native generic and SVG animation
        run: cargo nextest run --locked -p open-gpui-windows --all-features --lib -E 'test(platform::native_test_support::native_animation_tests::)' --run-ignored only --test-threads=1 --no-fail-fast --no-tests fail

      - name: Check Windows backend
        run: cargo check --locked -p open-gpui-windows --all-features

      - name: Test complete Windows backend
        env:
          GPUI_LEAK_DETECTION: '1'
        run: cargo nextest run --locked -p open-gpui-windows --all-features --lib --tests --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test desktop pixels, credentials and native retirement
        run: cargo nextest run --locked -p open-gpui-windows --all-features --lib -E 'test(native_frame_overlay_modes_reset_resize_preserve_input_and_retirement) | test(native_runtime_os_loads_routes_labels_text_and_exact_window_retirement) | test(credential) | test(native_send_foreground_) | test(native_springs_retarget_playback_reduce_motion_and_retire_active_frames) | test(native_randomized_tree_cached_color_hide_restore_click_and_retire)' --run-ignored only --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test additive support without handle tracking
        shell: pwsh
        env:
          GPUI_LEAK_DETECTION: ''
          GPUI_TEST_EXPECT_LEAK_DETECTION: 'off'
        run: |
          cargo nextest run --locked -p open-gpui --no-default-features --features test-support --lib --test test_support -E 'test(runtime_detection_tests) | binary(test_support)' --test-threads=1 --no-fail-fast --no-tests fail
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo nextest run --locked --manifest-path tests/fixtures/test-support-consumer/Cargo.toml --features bench-support --test public_api --target-dir target --test-threads=1 --no-fail-fast --no-tests fail
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo nextest run --locked -p open-gpui-windows --lib -E 'test(native_generic_views_compose_rebuild_cache_notify_and_release_exact_owners)' --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test explicit handle tracking and native release
        shell: pwsh
        env:
          GPUI_LEAK_DETECTION: '1'
          GPUI_TEST_EXPECT_LEAK_DETECTION: 'on'
        run: |
          cargo nextest run --locked -p open-gpui --all-features --lib --test test_support -E 'test(leak_tests::) | test(runtime_detection_tests) | binary(test_support)' --test-threads=1 --no-fail-fast --no-tests fail
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo nextest run --locked --manifest-path tests/fixtures/test-support-consumer/Cargo.toml --no-default-features --features test-support --test public_api --target-dir target --test-threads=1 --no-fail-fast --no-tests fail
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo nextest run --locked -p open-gpui-windows --features test-support,profiler --lib -E 'test(native_generic_views_compose_rebuild_cache_notify_and_release_exact_owners)' --test-threads=1 --no-fail-fast --no-tests fail
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:GPUI_LEAK_DETECTION = ''
          cargo nextest run --locked --manifest-path tests/fixtures/test-support-consumer/Cargo.toml --features leak-detection --test public_api --target-dir target --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test nonempty zero tracking selection
        shell: pwsh
        env:
          GPUI_LEAK_DETECTION: '0'
          GPUI_TEST_EXPECT_LEAK_DETECTION: 'on'
        run: |
          cargo nextest run --locked -p open-gpui --no-default-features --features test-support --test test_support -E 'test(snapshots_track_new_entities_only_when_explicitly_enabled)' --test-threads=1 --no-fail-fast --no-tests fail
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo nextest run --locked --manifest-path tests/fixtures/test-support-consumer/Cargo.toml --no-default-features --features test-support --test public_api --target-dir target --test-threads=1 --no-fail-fast --no-tests fail
  renderers-windows:
    name: verify GPU hosts (windows)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2

      - name: Test complete WGPU renderer and public consumers
        run: cargo nextest run --locked -p open-gpui-wgpu --all-features --lib --tests --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test independent application-owned GPU atlas
        run: cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --no-default-features --features wgpu-renderer --test wgpu_atlas --target-dir target --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test application-supplied DirectX renderer
        run: cargo nextest run --locked -p open-gpui-windows --all-features --lib -E 'test(native_custom_renderer_submits_imported_texture_resizes_and_retires_exact_gpu_prefix)' --run-ignored only --test-threads=1 --no-fail-fast --no-tests fail

      - name: Run ordinary WGPU hosts and native-close retirement
        run: |
          cargo run --locked -p open-gpui-wgpu-native --no-default-features -- --smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p open-gpui-wgpu-native --no-default-features -- --external-host --smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p open-gpui-wgpu-native --no-default-features -- --external-host --deferred --smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p open-gpui-wgpu-native --no-default-features -- --logical-root --smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p open-gpui-wgpu-native --no-default-features -- --external-host --logical-root --smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p open-gpui-wgpu-native --no-default-features -- --external-host --deferred --logical-root --smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p open-gpui-wgpu-native --no-default-features -- --logical-root --smoke --native-close

  web:
    name: verify browser (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@trunk
      - uses: Swatinem/rust-cache@v2

      - name: Check stable wasm surfaces
        run: |
          cargo check --locked -p open-gpui-web --target wasm32-unknown-unknown --tests
          cargo check --locked -p open-gpui-web --target wasm32-unknown-unknown
          cargo check --locked -p open-gpui-platform --target wasm32-unknown-unknown
          cargo check --locked -p open-gpui-wgpu --target wasm32-unknown-unknown
          cargo check --locked -p open-gpui-tracing -p open-gpui-sum-tree --features open-gpui-tracing/web --target wasm32-unknown-unknown --lib

      - name: Run complete browser web smoke
        run: cargo run --locked -p xtask -- web-smoke
