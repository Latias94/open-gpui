name: Verify

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1

jobs:
  msrv-windows:
    name: msrv (windows, Rust 1.93)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install minimum Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check framework on minimum Rust
        run: cargo +1.93.0 check --locked -p open-gpui -p open-gpui-wgpu -p open-gpui-windows -p open-gpui-canvas -p open-gpui-platform -p open-gpui-bench-metrics -p open-gpui-macros -p open-gpui-motion -p open-gpui-ui-core -p open-gpui-ui-components -p open-gpui-docking --all-features --all-targets -j 1

      - name: Check independent consumer on minimum Rust
        run: cargo +1.93.0 check --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --all-targets --all-features --target-dir target -j 1

      - name: Check independent test-support consumer on minimum Rust
        run: cargo +1.93.0 check --locked --manifest-path tests/fixtures/test-support-consumer/Cargo.toml --all-targets --all-features --target-dir target -j 1

      - name: Check hot-reload consumer on minimum Rust
        run: cargo +1.93.0 check --locked --manifest-path tests/fixtures/hot-reload-consumer/Cargo.toml --all-targets --target-dir target -j 1

  verify:
    name: verify (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
          - name: macos
            os: macos-15
          - name: windows
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-audit
        if: matrix.name == 'windows'
        uses: taiki-e/install-action@cargo-audit

      - name: Install trunk
        if: matrix.name == 'linux'
        uses: taiki-e/install-action@trunk

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install stable wasm target
        if: matrix.name == 'linux'
        run: rustup target add wasm32-unknown-unknown

      - name: Check stable wasm surfaces
        if: matrix.name == 'linux'
        run: |
          cargo check -p open-gpui-web --target wasm32-unknown-unknown --tests --locked -j 1
          cargo check -p open-gpui-web --target wasm32-unknown-unknown --locked -j 1
          cargo check -p open-gpui-platform --target wasm32-unknown-unknown --locked -j 1
          cargo check -p open-gpui-wgpu --target wasm32-unknown-unknown --locked -j 1

      - name: Run stable browser web smoke
        if: matrix.name == 'linux'
        run: cargo run -p xtask -- web-smoke

      - name: Install Linux system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            dbus \
            libfontconfig1-dev \
            libfreetype6-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config

      - name: Run host-testable web pointer sessions
        if: matrix.name == 'linux'
        run: cargo nextest run -p open-gpui-web --locked

      - name: Run verification gate
        if: matrix.name == 'windows'
        shell: pwsh
        env:
          GPUI_LEAK_DETECTION: '1'
          GPUI_TEST_EXPECT_LEAK_DETECTION: 'on'
        run: cargo run -p xtask -- verify

      - name: Run conditional hot-reload transport and render regressions
        run: cargo nextest run --locked -p open-gpui --no-default-features --features test-support,hot-reload --lib -E 'test(hot_reload::)' --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test retained image formats and decoder boundary
        run: cargo nextest run --locked -p open-gpui --all-features --lib -E 'test(platform::image_tests::) | test(elements::img::tests::)' --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test frame-time overlay ownership and public consumers
        run: |
          cargo nextest run --locked -p open-gpui --all-features --lib -E 'test(debug_overlay::) | test(window::profiler_tests::overlay::) | test(quiescence_releases_headless_resources_)' --test-threads=1 --no-fail-fast --no-tests fail
          cargo nextest run --locked -p open-gpui --all-features --test debug_overlay --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test independent frame-time overlay API
        if: matrix.name == 'windows'
        run: cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --no-default-features --features profiler --test debug_overlay --target-dir target --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test native frame-time overlay pixels and retirement
        if: matrix.name == 'windows'
        run: cargo nextest run --locked -p open-gpui-windows --all-features --lib -E 'test(=platform::native_test_support::native_profiler_tests::native_frame_overlay_modes_reset_resize_preserve_input_and_retirement)' --run-ignored only --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test generic animation scheduling and public composition
        run: cargo nextest run --locked -p open-gpui --all-features --lib --test animation -E 'test(elements::animation::) | test(elements::img::tests::reduced_motion::) | test(window::animation_tests::) | binary(animation)' --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test independent animation API without optional features
        if: matrix.name == 'windows'
        run: cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --no-default-features --test animation --target-dir target --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test native generic animation pixels and retirement
        if: matrix.name == 'windows'
        run: cargo nextest run --locked -p open-gpui-windows --all-features --lib -E 'test(=platform::native_test_support::native_animation_tests::native_generic_animations_progress_reduce_restore_and_retire_pending_frames)' --run-ignored only --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test system notification values, App responses and native transport
        run: cargo nextest run --locked -p open-gpui -p open-gpui-windows -p open-gpui-linux --all-features --lib --test system_notifications -E 'test(system_notification) | test(notification_simulation_) | binary(system_notifications)' --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test public credential tasks and unsupported add-only default
        run: cargo nextest run --locked -p open-gpui --all-features --test credentials --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test runtime platform identity and public keybinding workflows
        run: |
          cargo nextest run --locked -p open-gpui --all-features --test platform_info --test-threads=1 --no-fail-fast --no-tests fail
          cargo nextest run --locked -p open-gpui-command -p open-gpui-ui-components --all-features --test runtime_keybindings --test-threads=1 --no-fail-fast --no-tests fail
          cargo nextest run --locked -p open-gpui-web --lib -E 'test(platform_info::)' --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test scoped activity ownership and public controls
        run: cargo nextest run --locked -p open-gpui --all-features --lib --test idle_sleep -E 'test(app::idle_sleep_tests::) | binary(idle_sleep)' --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test native appearance forwarding and public controls
        run: |
          cargo nextest run --locked -p open-gpui --all-features --lib --test window_appearance -E 'test(app::window_appearance_tests::) | binary(window_appearance)' --test-threads=1 --no-fail-fast --no-tests fail
          cargo nextest run --locked -p open-gpui --no-default-features --features test-support --lib --test window_appearance -E 'test(app::window_appearance_tests::) | binary(window_appearance)' --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test independent native appearance API
        run: |
          cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --all-features --test window_appearance --target-dir target --test-threads=1 --no-fail-fast --no-tests fail
          cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --no-default-features --test window_appearance --target-dir target --test-threads=1 --no-fail-fast --no-tests fail

      - name: Check macOS appearance native consumers
        if: matrix.name == 'macos'
        run: |
          cargo nextest run --locked -p open-gpui-macos --all-features --lib -E 'test(platform::appearance_tests::)' --test-threads=1 --no-fail-fast --no-tests fail
          cargo check --locked -p open-gpui-macos --all-features --example native_window_appearance

      - name: Test scoped activity without profiler
        run: cargo nextest run --locked -p open-gpui --no-default-features --features test-support --lib --test idle_sleep -E 'test(app::idle_sleep_tests::) | binary(idle_sleep)' --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test Windows native activity lifetime and close refusal
        if: matrix.name == 'windows'
        run: cargo nextest run --locked -p open-gpui-windows --all-features --lib -E 'test(platform::activity::tests::)' --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test ordinary scoped activity with and without profiler
        run: |
          cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --no-default-features --test idle_sleep --target-dir target --test-threads=1 --no-fail-fast --no-tests fail
          cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --all-features --test idle_sleep --target-dir target --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test Linux idle-sleep acquisition and cancellation
        if: matrix.name == 'linux'
        run: |
          cargo nextest run --locked -p open-gpui-linux --all-features --lib -E 'test(idle_sleep_prevention_tests::)' --test-threads=1 --no-fail-fast --no-tests fail
          cargo nextest run --locked -p open-gpui-linux --no-default-features --lib -E 'test(headless_idle_sleep_prevention_is_unsupported)' --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test macOS typed activity acquisition and release
        if: matrix.name == 'macos'
        run: cargo nextest run --locked -p open-gpui-macos --all-features --lib -E 'test(activity::tests::)' --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test Linux isolated portal acquisition and actual release
        if: matrix.name == 'linux'
        run: cargo nextest run --locked -p open-gpui-linux --all-features --lib -E 'test(idle_sleep_portal_tests::)' --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test restart argument ownership and public configuration
        run: cargo nextest run --locked -p open-gpui --all-features --lib --test restart -E 'test(app::restart_tests::) | binary(restart)' --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test Windows restart encoding and PowerShell discovery
        if: matrix.name == 'windows'
        run: cargo nextest run --locked -p open-gpui-windows -p open-gpui-util --all-features --lib -E 'test(restart::tests::) | test(powershell_tests::) | test(returning_)' --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test ordinary native Windows relaunch and descendant retirement
        if: matrix.name == 'windows'
        run: cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --no-default-features --test restart --target-dir target --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test Linux restart command native argument forwarding
        if: matrix.name == 'linux'
        run: cargo nextest run --locked -p open-gpui-linux --all-features --lib -E 'test(restart_arguments_tests::)' --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test macOS restart command native argument forwarding
        if: matrix.name == 'macos'
        run: cargo nextest run --locked -p open-gpui-macos --all-features --lib -E 'test(restart_arguments_tests::)' --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test independent runtime platform conventions without test support
        run: cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --no-default-features --features bench-support --test platform_info --target-dir target --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test independent native keyboard mapping without test support
        if: matrix.name == 'windows'
        run: cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --no-default-features --test mapped_keybindings --target-dir target --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test native runtime OS routing, labels and retirement
        if: matrix.name == 'windows'
        run: cargo nextest run --locked -p open-gpui-windows --all-features --lib -E 'test(=platform::native_test_support::native_platform_info_tests::native_runtime_os_loads_routes_labels_text_and_exact_window_retirement)' --run-ignored only --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test independent credential tasks without test support
        run: cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --no-default-features --features bench-support --test credentials --target-dir target --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test native Windows credential storage, copying and thread ownership
        if: matrix.name == 'windows'
        run: cargo nextest run --locked -p open-gpui-windows --all-features --lib -E 'test(credential)' --run-ignored all --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test typed Keychain errors and independent ordinary API
        if: matrix.name == 'macos'
        run: |
          cargo nextest run --locked -p open-gpui-macos --all-features --lib -E 'test(keychain::)' --test-threads=1 --no-fail-fast --no-tests fail
          cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --no-default-features --test credentials --target-dir target --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test independent system notification API without optional features
        if: matrix.name == 'windows'
        run: cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --no-default-features --test system_notifications --target-dir target --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test sendable foreground scheduling and public App consumers
        run: cargo nextest run --locked -p open-gpui-scheduler -p open-gpui --all-features --lib --test send_foreground -E 'test(send_foreground) | test(send_local_executor) | binary(send_foreground)' --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test independent Send consumers with and without profiler
        if: matrix.name == 'windows'
        run: |
          cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --no-default-features --test send_foreground --target-dir target --test-threads=1 --no-fail-fast --no-tests fail
          cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --no-default-features --features profiler --test send_foreground --target-dir target --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test native Send dispatch, pixels and retirement
        if: matrix.name == 'windows'
        run: cargo nextest run --locked -p open-gpui-windows --all-features --lib -E 'test(native_send_foreground_)' --run-ignored all --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test Spring state, shared solver and public composition
        run: |
          cargo nextest run --locked -p open-gpui-motion --test-threads=1 --no-fail-fast --no-tests fail
          cargo nextest run --locked -p open-gpui --all-features --lib --test spring -E 'test(spring::) | test(elements::animation::spring_tests::) | test(window::spring_tests::) | test(app_reduced_motion_finishes_an_active_reveal_) | binary(spring)' --test-threads=1 --no-fail-fast --no-tests fail
          cargo nextest run --locked -p open-gpui-ui-components -p open-gpui-docking --all-features --lib --test app_motion -E 'test(app_reduced_) | test(app_motion_) | test(list_theme_reduced_) | binary(app_motion)' --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test independent Spring API without optional features
        if: matrix.name == 'windows'
        run: cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --no-default-features --test spring --target-dir target --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test native Spring pixels, playback and retirement
        if: matrix.name == 'windows'
        run: cargo nextest run --locked -p open-gpui-windows --all-features --lib -E 'test(=platform::native_test_support::native_spring_tests::native_springs_retarget_playback_reduce_motion_and_retire_active_frames)' --run-ignored only --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test public headless image resource consumers
        if: matrix.name == 'windows'
        run: cargo nextest run --locked -p open-gpui-wgpu --all-features --test images --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test independent images with application-owned encoder off and on
        if: matrix.name == 'windows'
        run: |
          cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --no-default-features --test images --target-dir target --test-threads=1 --no-fail-fast --no-tests fail
          cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --no-default-features --features avif-encoding --test images --target-dir target --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test public shared atlas without optional features
        run: cargo nextest run --locked -p open-gpui --no-default-features --test atlas --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test public shared atlas with all features
        run: cargo nextest run --locked -p open-gpui --all-features --test atlas --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test WGPU atlas resources and prepared-frame lifetime
        if: matrix.name == 'windows'
        run: cargo nextest run --locked -p open-gpui-wgpu --all-features --lib -E 'test(wgpu_atlas::tests::) | test(wgpu_renderer::atlas_tests::) | test(wgpu_renderer::webgl_tests::)' --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test independent application-owned WGPU atlas
        if: matrix.name == 'windows'
        run: cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --no-default-features --features wgpu-renderer --test wgpu_atlas --target-dir target --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test independent shared atlas without optional features
        if: matrix.name == 'windows'
        run: cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --no-default-features --test atlas --target-dir target --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test independent shared atlas with all features
        if: matrix.name == 'windows'
        run: cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --all-features --test atlas --target-dir target --test-threads=1 --no-fail-fast --no-tests fail

      - name: Run GPUI presentation public-surface contract
        if: matrix.name != 'windows'
        run: cargo nextest run -p open-gpui --all-features --test presentation_surface --locked --no-fail-fast

      - name: Run xtask tests
        if: matrix.name == 'windows'
        shell: pwsh
        run: cargo nextest run -p xtask

      - name: Run native docking rendered tests
        if: matrix.name == 'windows'
        shell: pwsh
        env:
          GPUI_LEAK_DETECTION: '1'
        run: cargo nextest run -p open-gpui-docking-native --no-fail-fast

      - name: Run docking authority tests
        if: matrix.name == 'windows'
        shell: pwsh
        env:
          GPUI_LEAK_DETECTION: '1'
        run: cargo nextest run -p open-gpui-docking --locked --no-fail-fast

      - name: Check Linux platform surface
        if: matrix.name == 'linux'
        run: cargo check -p open-gpui-linux --all-features --locked

      - name: Test Linux platform surface
        if: matrix.name == 'linux'
        run: cargo nextest run -p open-gpui-linux --all-features --locked --no-fail-fast

      - name: Check macOS font surface
        if: matrix.name == 'macos'
        run: cargo check -p open-gpui-macos --features font-kit --locked

      - name: Test macOS font surface
        if: matrix.name == 'macos'
        run: cargo nextest run -p open-gpui-macos --features font-kit --locked --no-fail-fast

      - name: Check Windows platform surface
        if: matrix.name == 'windows'
        shell: pwsh
        run: cargo check -p open-gpui-windows --all-features --locked

      - name: Test Windows platform surface
        if: matrix.name == 'windows'
        shell: pwsh
        env:
          GPUI_LEAK_DETECTION: '1'
        run: cargo nextest run -p open-gpui-windows --all-features --locked --no-fail-fast

      - name: Check native WGPU font-kit path
        run: cargo check -p open-gpui-wgpu --features font-kit --locked

      - name: Check independent dependency consumer
        run: cargo check --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --all-targets --all-features --target-dir target -j 1

      - name: Check independent test-support consumer
        run: cargo check --locked --manifest-path tests/fixtures/test-support-consumer/Cargo.toml --all-targets --all-features --target-dir target -j 1

      - name: Test profiler-enabled core contracts
        if: matrix.name == 'windows'
        shell: pwsh
        run: cargo nextest run --locked -p open-gpui --all-features --lib -E 'test(profiler) | test(draw_unwind) | test(frame_scheduling) | test(frame_pump) | test(power_mode) | test(view::) | test(cache_dependency_tests) | test(elements::list::) | test(list_overshoot) | test(measured_layout_tests) | test(window::a11y::) | test(cached_paint_atlas_tests::) | test(focus_generation_tests) | test(keyboard_activation) | test(clipboard_tests::)' --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test instrumentation-disabled core contracts
        if: matrix.name == 'windows'
        shell: pwsh
        run: cargo nextest run --locked -p open-gpui --no-default-features --features test-support --lib --test frame_scheduling --test power_cadence --test view_components --test rems --test accessibility_tree --test composite_focus --test clipboard -E 'test(profiler) | test(draw_unwind) | test(frame_scheduling) | test(frame_pump) | test(power_mode) | test(view::) | test(cache_dependency_tests) | test(elements::list::) | test(list_overshoot) | test(measured_layout_tests) | test(window::a11y::) | test(cached_paint_atlas_tests::) | test(focus_generation_tests) | test(keyboard_activation) | test(clipboard_tests::) | binary(frame_scheduling) | binary(power_cadence) | binary(view_components) | binary(rems) | binary(accessibility_tree) | binary(composite_focus) | binary(clipboard)' --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test lifecycle, journal and view public surfaces
        if: matrix.name == 'windows'
        shell: pwsh
        run: cargo nextest run --locked -p open-gpui --all-features --test lifecycle --test foreground_journal --test frame_signals --test frame_scheduling --test refresh_measurements --test power_cadence --test view_components --test rems --test accessibility_tree --test composite_focus --test clipboard --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test profiler-enabled independent consumer
        if: matrix.name == 'windows'
        shell: pwsh
        run: cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --all-features --test profiler --test lifecycle --test foreground_journal --test frame_signals --test frame_scheduling --test refresh_measurements --test power_cadence --test view_components --test rems --test measured_text --test accessibility_tree --test composite_focus --test clipboard --target-dir target --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test instrumentation-disabled independent consumer
        if: matrix.name == 'windows'
        shell: pwsh
        run: cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --no-default-features --test profiler --test lifecycle --test foreground_journal --test frame_signals --test frame_scheduling --test refresh_measurements --test power_cadence --test view_components --test rems --test measured_text --test accessibility_tree --test composite_focus --test clipboard --target-dir target --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test accessibility configuration and initial activation
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          cargo nextest run --locked -p open-gpui --all-features --lib --test accessibility_configuration -E 'test(a11y_activation_tests) | test(configuration_tests) | test(shutdown_fence_refuses_activation) | binary(accessibility_configuration)' --test-threads=1 --no-fail-fast --no-tests fail
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo nextest run --locked -p open-gpui --no-default-features --features test-support --lib --test accessibility_configuration -E 'test(a11y_activation_tests) | test(configuration_tests) | test(shutdown_fence_refuses_activation) | binary(accessibility_configuration)' --test-threads=1 --no-fail-fast --no-tests fail

