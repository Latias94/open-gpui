name: Verify

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - refactor/v2-slim-wgpu
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1

jobs:
  msrv-windows:
    name: msrv (windows, Rust 1.93)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install minimum Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check framework on minimum Rust
        run: cargo +1.93.0 check --locked -p open-gpui -p open-gpui-base -p open-gpui-wgpu -p open-gpui-platform -p open-gpui-macros --all-features --all-targets -j 1

      - name: Check independent test-support consumer on minimum Rust
        run: cargo +1.93.0 check --locked --manifest-path tests/fixtures/test-support-consumer/Cargo.toml --all-targets --all-features --target-dir target -j 1

      - name: Check hot-reload consumer on minimum Rust
        run: cargo +1.93.0 check --locked --manifest-path tests/fixtures/hot-reload-consumer/Cargo.toml --all-targets --target-dir target -j 1

  msrv-docking-windows:
    name: msrv (windows, docking and tooling, Rust 1.95)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install docking minimum Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check docking, examples, and tooling on minimum Rust
        run: cargo +1.95.0 check --locked -p open-gpui-docking -p open-gpui-docking-minimal -p open-gpui-docking-multiviewport -p open-gpui-dockspace-editor -p xtask --all-features --all-targets -j 1

      - name: Check independent consumer on docking minimum Rust
        run: cargo +1.95.0 check --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --all-targets --all-features --target-dir target -j 1

  quality:
    name: verify workspace and libraries (windows)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GPUI_LEAK_DETECTION: '1'
      GPUI_TEST_EXPECT_LEAK_DETECTION: 'on'

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting and workspace targets
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --workspace --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check -p open-gpui-smoke-native --locked

      - name: Resolve a single WGPU package
        run: cargo tree --locked --workspace --all-features --invert wgpu --depth 1

      - name: Test default Core without additive support
        run: cargo nextest run --locked -p open-gpui --lib --tests --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test default libraries and default docking
        run: cargo nextest run --locked -p open-gpui-base -p open-gpui-docking -p open-gpui-dockspace-editor --test-threads=1 --no-fail-fast --no-tests fail

      - name: Check repository contracts
        run: |
          cargo run --locked -p xtask -- verify-release-docs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p xtask -- scan-doc-links
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p xtask -- scan-import-boundary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p xtask -- scan-public-api --check

  libraries-windows:
    name: verify complete libraries (windows)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GPUI_LEAK_DETECTION: '1'
      GPUI_TEST_EXPECT_LEAK_DETECTION: 'on'

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Test complete libraries and shared docking
        run: cargo nextest run --locked -p open-gpui-base -p open-gpui-docking -p open-gpui-macros -p xtask --all-features --lib --tests --test-threads=1 --no-fail-fast --no-tests fail

  verify:
    name: verify (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 105
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
          - name: macos
            os: macos-15
          - name: windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Linux system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev dbus libfontconfig1-dev libfreetype6-dev libwayland-dev libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev xvfb pkg-config

      - name: Test complete Core and utility contracts
        run: cargo nextest run --locked -p open-gpui --all-features --lib --tests --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test Core without optional instrumentation
        run: cargo nextest run --locked -p open-gpui --no-default-features --features test-support --lib --tests --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test hot reload without default features
        run: cargo nextest run --locked -p open-gpui --no-default-features --features test-support,hot-reload --lib -E 'test(hot_reload::)' --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test WGPU text and font fallback
        run: cargo nextest run --locked -p open-gpui-wgpu --lib -E 'test(glyph_cache::) | test(run_replacements::) | test(text_edit::) | test(cosmic_text_system::font_installation_tests::)' --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test base controls without default features
        run: cargo nextest run --locked -p open-gpui-base --no-default-features --lib --tests --test-threads=1 --no-fail-fast --no-tests fail

      - name: Check Linux backend feature boundaries
        if: matrix.name == 'linux'
        run: |
          cargo check --locked -p open-gpui-platform --all-features
          cargo check --locked -p open-gpui-platform --no-default-features --features wayland --lib
          cargo check --locked -p open-gpui-platform --no-default-features --features x11 --lib
          cargo check --locked -p open-gpui-platform --no-default-features --features x11,wayland --example toggle_headless

      - name: Test Linux backends and headless activity
        if: matrix.name == 'linux'
        run: |
          cargo nextest run --locked -p open-gpui-platform --all-features --lib --tests --test-threads=1 --no-fail-fast --no-tests fail
          cargo nextest run --locked -p open-gpui-platform --no-default-features --lib -E 'test(headless_idle_sleep_prevention_is_unsupported)' --test-threads=1 --no-fail-fast --no-tests fail
          cargo nextest run --locked -p open-gpui-platform --no-default-features --features x11,wayland,test-support --lib -E 'test(/^linux::x11::clipboard::native_windowing_tests::/)' --run-ignored only --test-threads=1 --no-fail-fast --no-tests fail

      - name: Check macOS backends and native examples
        if: matrix.name == 'macos'
        run: |
          cargo check --locked -p open-gpui-platform --all-features --all-targets

      - name: Test macOS platform and CoreText
        if: matrix.name == 'macos'
        run: cargo nextest run --locked -p open-gpui-platform --features font-kit --lib --tests --test-threads=1 --no-fail-fast --no-tests fail

      - name: Check native WGPU font-kit path
        run: cargo check --locked -p open-gpui-wgpu --features font-kit

  consumers:
    name: verify consumers (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
          - name: macos
            os: macos-15
          - name: windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Linux system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libfontconfig1-dev libfreetype6-dev libwayland-dev libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev pkg-config

      - name: Check independently locked consumer targets
        run: cargo check --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --all-targets --all-features --target-dir target

      - name: Check independent test-support targets
        run: cargo check --locked --manifest-path tests/fixtures/test-support-consumer/Cargo.toml --all-targets --all-features --target-dir target

      - name: Test independent API without optional features
        run: cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --no-default-features --tests --target-dir target --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test independent headless platform API
        run: cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --no-default-features --features test-support,profiler --tests --target-dir target --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test complete independent API
        run: cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --all-features --tests -E 'not binary(wgpu_atlas)' --target-dir target --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test minimal optional feature boundaries
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --no-default-features --features profiler --test debug_overlay --test send_foreground --target-dir target --test-threads=1 --no-fail-fast --no-tests fail
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --no-default-features --features avif-encoding --test images --target-dir target --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test independent support and dedicated execution
        run: cargo nextest run --locked --manifest-path tests/fixtures/test-support-consumer/Cargo.toml --features test-support --tests --target-dir target --test-threads=1 --no-fail-fast --no-tests fail

  native-windows:
    # Programmatic HWND, renderer and retirement tests run on the hosted Windows image.
    # Physical input, clean-desktop Z-order and mixed-DPI qualification run locally
    name: verify native (windows)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Test native generic and SVG animation
        run: cargo nextest run --locked -p open-gpui-platform --all-features --lib -E 'test(windows::platform::native_test_support::native_animation_tests::)' --run-ignored only --test-threads=1 --no-fail-fast --no-tests fail

      - name: Check Windows backend
        run: cargo check --locked -p open-gpui-platform --all-features

      - name: Test complete Windows backend
        env:
          GPUI_LEAK_DETECTION: '1'
        run: cargo nextest run --locked -p open-gpui-platform --all-features --lib --tests --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test desktop pixels and native retirement
        run: cargo nextest run --locked -p open-gpui-platform --all-features --lib -E 'test(native_frame_overlay_modes_reset_resize_preserve_input_and_retirement) | test(native_runtime_os_loads_routes_labels_text_and_exact_window_retirement) | test(native_send_foreground_) | test(native_springs_retarget_playback_reduce_motion_and_retire_active_frames) | test(native_randomized_tree_cached_color_hide_restore_click_and_retire)' --run-ignored only --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test additive support without handle tracking
        shell: pwsh
        env:
          GPUI_LEAK_DETECTION: ''
          GPUI_TEST_EXPECT_LEAK_DETECTION: 'off'
        run: |
          cargo nextest run --locked -p open-gpui --no-default-features --features test-support --lib --test test_support -E 'test(runtime_detection_tests) | binary(test_support)' --test-threads=1 --no-fail-fast --no-tests fail
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo nextest run --locked --manifest-path tests/fixtures/test-support-consumer/Cargo.toml --features test-support --test public_api --target-dir target --test-threads=1 --no-fail-fast --no-tests fail
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo nextest run --locked -p open-gpui-platform --lib -E 'test(native_generic_views_compose_rebuild_cache_notify_and_release_exact_owners)' --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test explicit handle tracking and native release
        shell: pwsh
        env:
          GPUI_LEAK_DETECTION: '1'
          GPUI_TEST_EXPECT_LEAK_DETECTION: 'on'
        run: |
          cargo nextest run --locked -p open-gpui --all-features --lib --test test_support -E 'test(leak_tests::) | test(runtime_detection_tests) | binary(test_support)' --test-threads=1 --no-fail-fast --no-tests fail
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo nextest run --locked --manifest-path tests/fixtures/test-support-consumer/Cargo.toml --no-default-features --features test-support --test public_api --target-dir target --test-threads=1 --no-fail-fast --no-tests fail
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo nextest run --locked -p open-gpui-platform --features test-support,profiler --lib -E 'test(native_generic_views_compose_rebuild_cache_notify_and_release_exact_owners)' --test-threads=1 --no-fail-fast --no-tests fail
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:GPUI_LEAK_DETECTION = ''
          cargo nextest run --locked --manifest-path tests/fixtures/test-support-consumer/Cargo.toml --features leak-detection --test public_api --target-dir target --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test nonempty zero tracking selection
        shell: pwsh
        env:
          GPUI_LEAK_DETECTION: '0'
          GPUI_TEST_EXPECT_LEAK_DETECTION: 'on'
        run: |
          cargo nextest run --locked -p open-gpui --no-default-features --features test-support --test test_support -E 'test(snapshots_track_new_entities_only_when_explicitly_enabled)' --test-threads=1 --no-fail-fast --no-tests fail
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo nextest run --locked --manifest-path tests/fixtures/test-support-consumer/Cargo.toml --no-default-features --features test-support --test public_api --target-dir target --test-threads=1 --no-fail-fast --no-tests fail

  renderers-windows:
    name: verify GPU hosts (windows)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Test complete WGPU renderer and public consumers
        run: cargo nextest run --locked -p open-gpui-wgpu --all-features --lib --tests --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test independent application-owned GPU atlas
        run: cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --no-default-features --features wgpu-renderer --test wgpu_atlas --target-dir target --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test application-supplied Windows renderer
        run: cargo nextest run --locked -p open-gpui-platform --all-features --lib -E 'test(native_custom_renderer_submits_imported_texture_resizes_and_retires_exact_gpu_prefix)' --run-ignored only --test-threads=1 --no-fail-fast --no-tests fail

      - name: Run ordinary WGPU hosts and native-close retirement
        run: |
          cargo run --locked -p open-gpui-wgpu-native --no-default-features -- --smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p open-gpui-wgpu-native --no-default-features -- --external-host --smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p open-gpui-wgpu-native --no-default-features -- --external-host --deferred --smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p open-gpui-wgpu-native --no-default-features -- --logical-root --smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p open-gpui-wgpu-native --no-default-features -- --external-host --logical-root --smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p open-gpui-wgpu-native --no-default-features -- --external-host --deferred --logical-root --smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p open-gpui-wgpu-native --no-default-features -- --logical-root --smoke --native-close
