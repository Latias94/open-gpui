name: Verify

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv-windows:
    name: msrv (windows, Rust 1.92)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install minimum Rust toolchain
        uses: dtolnay/rust-toolchain@1.92.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check framework on minimum Rust
        run: cargo +1.92.0 check --locked -p open-gpui -p open-gpui-wgpu -p open-gpui-windows -p open-gpui-canvas --all-features --all-targets -j 1

      - name: Check independent consumer on minimum Rust
        run: cargo +1.92.0 check --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --all-targets --all-features --target-dir target -j 1

  verify:
    name: verify (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
          - name: macos
            os: macos-15
          - name: windows
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-audit
        if: matrix.name == 'windows'
        uses: taiki-e/install-action@cargo-audit

      - name: Install trunk
        if: matrix.name == 'linux'
        uses: taiki-e/install-action@trunk

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install stable wasm target
        if: matrix.name == 'linux'
        run: rustup target add wasm32-unknown-unknown

      - name: Check stable wasm surfaces
        if: matrix.name == 'linux'
        run: |
          cargo check -p open-gpui-web --target wasm32-unknown-unknown --tests --locked -j 1
          cargo check -p open-gpui-web --target wasm32-unknown-unknown --locked -j 1
          cargo check -p open-gpui-platform --target wasm32-unknown-unknown --locked -j 1
          cargo check -p open-gpui-wgpu --target wasm32-unknown-unknown --locked -j 1

      - name: Run stable browser web smoke
        if: matrix.name == 'linux'
        run: cargo run -p xtask -- web-smoke

      - name: Install Linux system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config

      - name: Run host-testable web pointer sessions
        if: matrix.name == 'linux'
        run: cargo nextest run -p open-gpui-web --locked

      - name: Run verification gate
        if: matrix.name == 'windows'
        shell: pwsh
        run: cargo run -p xtask -- verify

      - name: Run GPUI presentation public-surface contract
        if: matrix.name != 'windows'
        run: cargo nextest run -p open-gpui --all-features --test presentation_surface --locked --no-fail-fast

      - name: Run xtask tests
        if: matrix.name == 'windows'
        shell: pwsh
        run: cargo nextest run -p xtask

      - name: Run native docking rendered tests
        if: matrix.name == 'windows'
        shell: pwsh
        run: cargo nextest run -p open-gpui-docking-native --no-fail-fast

      - name: Run docking authority tests
        if: matrix.name == 'windows'
        shell: pwsh
        run: cargo nextest run -p open-gpui-docking --locked --no-fail-fast

      - name: Check Linux platform surface
        if: matrix.name == 'linux'
        run: cargo check -p open-gpui-linux --all-features --locked

      - name: Test Linux platform surface
        if: matrix.name == 'linux'
        run: cargo nextest run -p open-gpui-linux --all-features --locked --no-fail-fast

      - name: Check macOS font surface
        if: matrix.name == 'macos'
        run: cargo check -p open-gpui-macos --features font-kit --locked

      - name: Test macOS font surface
        if: matrix.name == 'macos'
        run: cargo nextest run -p open-gpui-macos --features font-kit --locked --no-fail-fast

      - name: Check Windows platform surface
        if: matrix.name == 'windows'
        shell: pwsh
        run: cargo check -p open-gpui-windows --all-features --locked

      - name: Test Windows platform surface
        if: matrix.name == 'windows'
        shell: pwsh
        run: cargo nextest run -p open-gpui-windows --all-features --locked --no-fail-fast

      - name: Check native WGPU font-kit path
        run: cargo check -p open-gpui-wgpu --features font-kit --locked

      - name: Check independent dependency consumer
        run: cargo check --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --all-targets --all-features --target-dir target -j 1

      - name: Test profiler-enabled core contracts
        if: matrix.name == 'windows'
        shell: pwsh
        run: cargo nextest run --locked -p open-gpui --all-features --lib -E 'test(profiler) | test(draw_unwind) | test(frame_scheduling) | test(frame_pump) | test(power_mode) | test(view::) | test(cache_dependency_tests) | test(elements::list::) | test(list_overshoot) | test(measured_layout_tests) | test(window::a11y::) | test(cached_paint_atlas_tests::) | test(focus_generation_tests) | test(keyboard_activation)' -j 1 --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test instrumentation-disabled core contracts
        if: matrix.name == 'windows'
        shell: pwsh
        run: cargo nextest run --locked -p open-gpui --no-default-features --features test-support --lib --test frame_scheduling --test power_cadence --test view_components --test rems --test accessibility_tree --test composite_focus -E 'test(profiler) | test(draw_unwind) | test(frame_scheduling) | test(frame_pump) | test(power_mode) | test(view::) | test(cache_dependency_tests) | test(elements::list::) | test(list_overshoot) | test(measured_layout_tests) | test(window::a11y::) | test(cached_paint_atlas_tests::) | test(focus_generation_tests) | test(keyboard_activation) | binary(frame_scheduling) | binary(power_cadence) | binary(view_components) | binary(rems) | binary(accessibility_tree) | binary(composite_focus)' -j 1 --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test lifecycle, journal and view public surfaces
        if: matrix.name == 'windows'
        shell: pwsh
        run: cargo nextest run --locked -p open-gpui --all-features --test lifecycle --test foreground_journal --test frame_signals --test frame_scheduling --test refresh_measurements --test power_cadence --test view_components --test rems --test accessibility_tree --test composite_focus -j 1 --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test profiler-enabled independent consumer
        if: matrix.name == 'windows'
        shell: pwsh
        run: cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --all-features --test profiler --test lifecycle --test foreground_journal --test frame_signals --test frame_scheduling --test refresh_measurements --test power_cadence --test view_components --test rems --test measured_text --test accessibility_tree --test composite_focus --target-dir target -j 1 --test-threads=1 --no-fail-fast --no-tests fail

      - name: Test instrumentation-disabled independent consumer
        if: matrix.name == 'windows'
        shell: pwsh
        run: cargo nextest run --locked --manifest-path tests/fixtures/dependency-consumer/Cargo.toml --no-default-features --test profiler --test lifecycle --test foreground_journal --test frame_signals --test frame_scheduling --test refresh_measurements --test power_cadence --test view_components --test rems --test measured_text --test accessibility_tree --test composite_focus --target-dir target -j 1 --test-threads=1 --no-fail-fast --no-tests fail

      - name: Run native WGPU package tests
        if: matrix.name == 'windows'
        shell: pwsh
        run: cargo nextest run -p open-gpui-wgpu --features font-kit --locked --no-fail-fast
