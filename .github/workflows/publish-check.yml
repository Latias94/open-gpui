name: Publish Check

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  package-check:
    name: package-check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"

      - name: Check crate packageability
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess

          meta = json.loads(
              subprocess.check_output(
                  ["cargo", "metadata", "--format-version", "1", "--no-deps", "--locked"],
                  text=True,
              )
          )

          workspace_ids = set(meta["workspace_members"])
          packages = [
              pkg
              for pkg in meta["packages"]
              if pkg["id"] in workspace_ids
              and any("lib" in target["kind"] or "proc-macro" in target["kind"] for target in pkg["targets"])
          ]
          workspace_names = {pkg["name"] for pkg in packages}

          def has_local_workspace_dep(pkg):
              for dep in pkg["dependencies"]:
                  if dep.get("source") is None and dep.get("path") and dep["name"] in workspace_names:
                      return True
              return False

          leaf = sorted((pkg for pkg in packages if not has_local_workspace_dep(pkg)), key=lambda pkg: pkg["name"])
          non_leaf = sorted((pkg for pkg in packages if has_local_workspace_dep(pkg)), key=lambda pkg: pkg["name"])
          explicit_package_targets = {"open-gpui-canvas"}

          print("Leaf crates:")
          print(", ".join(pkg["name"] for pkg in leaf) or "(none)")
          print("Non-leaf crates:")
          print(", ".join(pkg["name"] for pkg in non_leaf) or "(none)")

          # Leaf crates get a full package build. Crates that still depend on local workspace
          # packages are checked with --list until their dependency chain can be published.
          def run_package(pkg, extra_args):
              print(f"::group::cargo package {pkg['name']} {' '.join(extra_args)}")
              subprocess.run(
                  ["cargo", "package", "-p", pkg["name"], "--locked", *extra_args],
                  check=True,
              )
              print("::endgroup::")

          for pkg in leaf:
              run_package(pkg, ["--no-verify"])

          for pkg in packages:
              if pkg["name"] in explicit_package_targets and pkg not in leaf:
                  run_package(pkg, ["--no-verify"])

          for pkg in non_leaf:
              if pkg["name"] not in explicit_package_targets:
                  run_package(pkg, ["--list"])
          PY
