name: Windows native interactive

on:
  merge_group:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: open-gpui-windows-native-interactive
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: '1'
  CARGO_TERM_COLOR: always
  OPEN_GPUI_NATIVE_INTERACTIVE: '1'
  OPEN_GPUI_NATIVE_CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}

jobs:
  runner-preflight:
    name: native interactive runner preflight
    runs-on:
      - self-hosted
      - windows
      - x64
      - open-gpui-windows-native-interactive-ephemeral
    timeout-minutes: 45

    steps:
      - name: Verify ephemeral interactive runner attestation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $machine = [EnvironmentVariableTarget]::Machine
          $required = @{
            OPEN_GPUI_NATIVE_RUNNER_EPHEMERAL = '1'
            OPEN_GPUI_NATIVE_RUNNER_ONE_JOB = '1'
            OPEN_GPUI_NATIVE_RUNNER_NETWORK_POLICY = 'deny-default-v1'
          }
          foreach ($entry in $required.GetEnumerator()) {
            $actual = [Environment]::GetEnvironmentVariable($entry.Key, $machine)
            if ($actual -ne $entry.Value) {
              throw "Native runner attestation $($entry.Key) must be '$($entry.Value)', got '$actual'"
            }
          }

          $imageId = [Environment]::GetEnvironmentVariable('OPEN_GPUI_NATIVE_RUNNER_CLEAN_IMAGE_ID', $machine)
          if ($imageId -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]{7,127}$') {
            throw "Native runner clean-image attestation is missing or malformed"
          }
          $expectedSid = [Environment]::GetEnvironmentVariable('OPEN_GPUI_NATIVE_RUNNER_ACCOUNT_SID', $machine)
          $currentSid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          if ([string]::IsNullOrWhiteSpace($expectedSid) -or $currentSid -ne $expectedSid) {
            throw "Native runner account SID does not match its machine attestation"
          }
          $sessionId = [Diagnostics.Process]::GetCurrentProcess().SessionId
          if (-not [Environment]::UserInteractive -or $sessionId -eq 0) {
            throw "Native runner must execute in a non-service interactive Windows session"
          }

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.OPEN_GPUI_NATIVE_CANDIDATE_SHA }}
          persist-credentials: false

      - name: Verify exact candidate checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidateSha = $env:OPEN_GPUI_NATIVE_CANDIDATE_SHA.Trim()
          if ($candidateSha -notmatch '^(?:[0-9a-fA-F]{40}|[0-9a-fA-F]{64})$') {
            throw "Native interactive candidate is not a full Git object id: $candidateSha"
          }
          $actualSha = (git rev-parse HEAD).Trim()
          if ($actualSha -ne $candidateSha) {
            throw "Native interactive checkout drifted: expected $candidateSha, got $actualSha"
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Install nextest
        uses: taiki-e/install-action@9e3720000324bf314ab081346108fc3bab8d6b74 # nextest

      - name: Rust cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Run the manifest-owned native Dock gate
        shell: pwsh
        run: cargo run --locked -p xtask -- native-windows-interactive
