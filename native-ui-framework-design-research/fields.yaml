topic: "原生 UI 通用框架应该如何设计"
field_categories:
  - category: "定位"
    fields:
      - name: "positioning"
        description: "生态定位：组件库、headless primitive、framework、docs/gallery、token pipeline、scaffold/registry、desktop shell 或 accessibility infrastructure。"
        detail_level: "简要"
        required: true
      - name: "target_users"
        description: "主要服务对象。"
        detail_level: "简要"
        required: true
      - name: "primary_value_proposition"
        description: "核心价值主张以及与 open-gpui 目标的匹配度。"
        detail_level: "简要"
        required: true
  - category: "分发与生态"
    fields:
      - name: "distribution_model"
        description: "package dependency、copy-to-own、registry、CLI add、template/scaffold、feature flags、plugin marketplace 等分发方式。"
        detail_level: "详细"
        required: true
      - name: "source_ownership"
        description: "用户是否拥有源码，升级、patch、fork、merge 成本如何。"
        detail_level: "详细"
        required: true
      - name: "registry_viability"
        description: "registry 对 native Rust UI 是否必要；若必要，应是什么 registry 形态。"
        detail_level: "详细"
        required: true
      - name: "rust_distribution_fit"
        description: "与 Cargo、crates.io、workspace、feature flags、SemVer、cargo add、cargo generate、xtask 的适配度。"
        detail_level: "详细"
        required: true
      - name: "third_party_ecosystem_path"
        description: "第三方组件、主题、recipes、plugins、examples 如何进入生态。"
        detail_level: "详细"
        required: true
  - category: "AI 时代设计"
    fields:
      - name: "ai_friendliness"
        description: "是否容易被 AI 检索、理解、组合、修改、验证。"
        detail_level: "详细"
        required: true
      - name: "machine_readable_contracts"
        description: "是否提供 schema/manifest/typed registry，能否驱动 docs、gallery、scaffold、tests。"
        detail_level: "详细"
        required: true
      - name: "copy_modify_verify_loop"
        description: "复制/生成组件后如何本地修改并验证。"
        detail_level: "详细"
        required: true
  - category: "API 与组合"
    fields:
      - name: "api_ergonomics"
        description: "API 形态与调用体验。"
        detail_level: "详细"
        required: true
      - name: "customization_model"
        description: "用户如何改样式、结构、子组件、行为、theme token、interaction policy。"
        detail_level: "详细"
        required: true
      - name: "component_anatomy_model"
        description: "复杂组件是否拆为 root/trigger/content/item/indicator/portal 等 parts。"
        detail_level: "详细"
        required: true
      - name: "state_ownership_model"
        description: "controlled/uncontrolled、state hoisting、renderer-neutral state、application-owned state、runtime handles 如何划分。"
        detail_level: "详细"
        required: true
  - category: "Headless 与行为"
    fields:
      - name: "headless_boundary"
        description: "行为逻辑、状态机、a11y metadata、layout/positioning、render adapter、style/theme 是否清楚分层。"
        detail_level: "详细"
        required: true
      - name: "accessibility_model"
        description: "role、focus、keyboard、screen reader、ARIA/AccessKit、label、value、action、relationship 如何表达和测试。"
        detail_level: "详细"
        required: true
      - name: "positioning_and_collision_model"
        description: "overlay、tooltip、popover、menu、dropdown 的 positioning、collision、flip、shift、size、arrow、safe polygon、dismiss、focus return 如何抽象。"
        detail_level: "详细"
        required: true
      - name: "interaction_state_machines"
        description: "是否有可测试的 finite state machine 或 equivalent contract。"
        detail_level: "详细"
        required: true
  - category: "渲染与性能"
    fields:
      - name: "rendering_model"
        description: "DOM/WebView、native retained、immediate mode、自绘、GPU scene、incremental render 的基本模型。"
        detail_level: "简要"
        required: true
      - name: "performance_model"
        description: "大列表、大表格、大树、文本、canvas、overlay、layout、incremental diff、scroll ownership 的性能策略。"
        detail_level: "详细"
        required: true
      - name: "native_advantage"
        description: "哪些场景 native GPUI 应明显胜过 WebView/DOM。"
        detail_level: "详细"
        required: true
      - name: "web_ecosystem_advantage"
        description: "哪些场景 Web/Tauri/Electron 生态天然更强，open-gpui 是否应避开或互操作。"
        detail_level: "详细"
        required: true
  - category: "主题与设计系统"
    fields:
      - name: "theme_token_model"
        description: "token/schema/theme file/runtime theme/fallback/modes/states/variants 如何设计。"
        detail_level: "详细"
        required: true
      - name: "design_token_pipeline"
        description: "是否支持 DTCG/Style Dictionary/Tailwind-like transform；如何跨平台输出。"
        detail_level: "详细"
        required: true
      - name: "style_customization_boundary"
        description: "样式由 framework、theme recipe、component prop、用户源码、app adapter 哪一层负责。"
        detail_level: "详细"
        required: true
  - category: "组件表面"
    fields:
      - name: "component_coverage"
        description: "基础控件、form、overlay、navigation、data display、feedback、application shell、rich components 的覆盖度。"
        detail_level: "简要"
        required: true
      - name: "must_have_for_open_gpui"
        description: "对 open-gpui 通用 UI 框架来说是否必须补齐。"
        detail_level: "详细"
        required: true
      - name: "do_not_chase"
        description: "哪些能力不适合 open-gpui 当前阶段追。"
        detail_level: "详细"
        required: true
  - category: "文档测试工具"
    fields:
      - name: "docs_gallery_model"
        description: "docs、story、gallery、examples、manual dogfood、AI examples 是否由同一事实源派生。"
        detail_level: "详细"
        required: true
      - name: "testing_strategy"
        description: "unit、contract、visual、interaction、a11y、performance、API surface、schema drift、import boundary gate。"
        detail_level: "详细"
        required: true
      - name: "diagnostics_and_failure_quality"
        description: "失败时是否能给出组件、文件、token、修复方向；是否适合 AI 自动修复。"
        detail_level: "详细"
        required: true
  - category: "治理"
    fields:
      - name: "versioning_and_breakage"
        description: "API 稳定性、SemVer、breaking change、migration guide、copy-to-own drift、registry compatibility。"
        detail_level: "详细"
        required: true
      - name: "maintenance_cost"
        description: "实现和维护成本。"
        detail_level: "详细"
        required: true
      - name: "risks"
        description: "复杂度、生态错位、过度复刻 Web、性能优势被稀释、AI 生成不可验证、组件碎片化等风险。"
        detail_level: "详细"
        required: true
      - name: "open_gpui_relevance"
        description: "最终建议：adopt、trial、reference-only、defer、reject，并说明对 open-gpui 的直接设计含义。"
        detail_level: "详细"
        required: true

field_groups:
  positioning:
    - name: "positioning"
      description: "该对象在生态中的定位：组件库、headless primitive、rendering framework、docs/gallery system、token pipeline、scaffold/registry、desktop shell 或 accessibility infrastructure。"
      detail_level: "简要"
    - name: "target_users"
      description: "主要服务谁：应用开发者、设计系统作者、框架作者、AI agent、桌面产品团队、库维护者。"
      detail_level: "简要"
    - name: "primary_value_proposition"
      description: "它最核心解决什么痛点，是否与 open-gpui 的原生性能和生态目标匹配。"
      detail_level: "简要"

  distribution_and_ecosystem:
    - name: "distribution_model"
      description: "分发方式：package dependency、copy-to-own、registry、CLI add、template/scaffold、monorepo、feature flags、plugin marketplace。"
      detail_level: "详细"
    - name: "source_ownership"
      description: "用户拥有源码并可改，还是依赖黑盒 API；升级、patch、fork、merge 成本如何。"
      detail_level: "详细"
    - name: "registry_viability"
      description: "registry 对 native Rust UI 是否必要；如必要，是源码 registry、metadata registry、recipe registry、theme registry 还是 mixed model。"
      detail_level: "详细"
    - name: "rust_distribution_fit"
      description: "与 Cargo、crates.io、workspace、feature flags、SemVer、cargo add、cargo generate、xtask 的适配度。"
      detail_level: "详细"
    - name: "third_party_ecosystem_path"
      description: "第三方组件、主题、recipes、plugins、examples 如何进入生态；审核、版本、兼容性如何处理。"
      detail_level: "详细"

  ai_era_design:
    - name: "ai_friendliness"
      description: "是否容易被 AI 检索、理解、组合、修改、验证；是否有结构化 metadata、examples、recipes、tests、constraints。"
      detail_level: "详细"
    - name: "machine_readable_contracts"
      description: "是否提供 JSON/YAML/schema/manifest/typed registry，能否驱动 docs、gallery、scaffold、tests。"
      detail_level: "详细"
    - name: "copy_modify_verify_loop"
      description: "开发者或 AI 复制/生成组件后，如何本地修改并用 contract、visual、a11y、performance gate 验证。"
      detail_level: "详细"

  api_and_composition:
    - name: "api_ergonomics"
      description: "API 形态：builder pattern、declarative composition、slot/anatomy、modifier、hooks/state machine、callback/event、typed props。"
      detail_level: "详细"
    - name: "customization_model"
      description: "用户如何改样式、结构、子组件、行为、theme token、interaction policy；是否支持 escape hatch。"
      detail_level: "详细"
    - name: "component_anatomy_model"
      description: "复杂组件是否拆为 root/trigger/content/item/indicator/portal 等 parts；是否适合 GPUI Element/Entity 模型。"
      detail_level: "详细"
    - name: "state_ownership_model"
      description: "controlled/uncontrolled、state hoisting、renderer-neutral state、application-owned state、runtime handles 如何划分。"
      detail_level: "详细"

  headless_and_behavior:
    - name: "headless_boundary"
      description: "行为逻辑、状态机、a11y metadata、layout/positioning、render adapter、style/theme 是否清楚分层。"
      detail_level: "详细"
    - name: "accessibility_model"
      description: "role、focus、keyboard、screen reader、ARIA/AccessKit、label、value、action、relationship 如何表达和测试。"
      detail_level: "详细"
    - name: "positioning_and_collision_model"
      description: "overlay、tooltip、popover、menu、dropdown 的 positioning、collision、flip、shift、size、arrow、safe polygon、dismiss、focus return 如何抽象。"
      detail_level: "详细"
    - name: "interaction_state_machines"
      description: "是否有可测试的 finite state machine 或 equivalent contract；如何覆盖 menu/select/dialog/tabs/combobox/table/tree。"
      detail_level: "详细"

  rendering_and_performance:
    - name: "rendering_model"
      description: "DOM/WebView、native retained、immediate mode、自绘、GPU scene、incremental render 的基本模型。"
      detail_level: "简要"
    - name: "performance_model"
      description: "大列表、大表格、大树、文本、canvas、overlay、layout、incremental diff、scroll ownership 的性能策略。"
      detail_level: "详细"
    - name: "native_advantage"
      description: "哪些场景 native GPUI 应该明显胜过 WebView/DOM；是否足以形成生态差异化。"
      detail_level: "详细"
    - name: "web_ecosystem_advantage"
      description: "哪些场景 Web/Tauri/Electron 生态天然更强，open-gpui 是否应避开或互操作。"
      detail_level: "详细"

  theming_and_design_system:
    - name: "theme_token_model"
      description: "token/schema/theme file/runtime theme/fallback/modes/states/variants 如何设计。"
      detail_level: "详细"
    - name: "design_token_pipeline"
      description: "是否支持 DTCG/Style Dictionary/Tailwind-like transform；如何跨平台输出；如何保持 schema drift gate。"
      detail_level: "详细"
    - name: "style_customization_boundary"
      description: "样式由 framework、theme recipe、component prop、用户源码、app adapter 哪一层负责。"
      detail_level: "详细"

  component_surface:
    - name: "component_coverage"
      description: "基础控件、form、overlay、navigation、data display、feedback、application shell、rich components 的覆盖度。"
      detail_level: "简要"
    - name: "must_have_for_open_gpui"
      description: "对 open-gpui 通用 UI 框架来说是否是必须补齐的能力，还是可以延后/拒绝。"
      detail_level: "详细"
    - name: "do_not_chase"
      description: "哪些能力虽存在于参考项目，但不适合 open-gpui 当前阶段追，例如应用级 title bar、editor、webview、settings 等。"
      detail_level: "详细"

  docs_testing_tooling:
    - name: "docs_gallery_model"
      description: "docs、story、gallery、examples、manual dogfood、AI examples 是否由同一事实源派生。"
      detail_level: "详细"
    - name: "testing_strategy"
      description: "unit、contract、visual、interaction、a11y、performance、API surface、schema drift、import boundary gate。"
      detail_level: "详细"
    - name: "diagnostics_and_failure_quality"
      description: "失败时是否能给出组件、文件、token、修复方向；是否适合 AI 自动修复。"
      detail_level: "详细"

  governance:
    - name: "versioning_and_breakage"
      description: "API 稳定性、SemVer、breaking change、migration guide、copy-to-own drift、registry compatibility。"
      detail_level: "详细"
    - name: "maintenance_cost"
      description: "实现和维护成本：核心团队负担、社区 contribution、docs/testing 更新成本、长期 API 锁定成本。"
      detail_level: "详细"
    - name: "risks"
      description: "复杂度、生态错位、过度复刻 Web、性能优势被稀释、AI 生成不可验证、组件碎片化等风险。"
      detail_level: "详细"
    - name: "open_gpui_relevance"
      description: "最终建议：adopt、trial、reference-only、defer、reject，并说明对 open-gpui 的直接设计含义。"
      detail_level: "详细"

uncertain:
  - "open-gpui 是否真的需要 shadcn 式源码 registry，还是只需要 machine-readable metadata registry。"
  - "Rust/native UI 的第三方组件分发生态是否能绕开 npm 式 registry，直接依赖 Cargo + scaffold recipes。"
  - "Floating UI 的 Rust 实现或算法是否适合直接进入 GPUI overlay primitive，还是应该重写为纯 open-gpui geometry contract。"
  - "AI-era component distribution 的最佳单位是 crate、component file、recipe、contract row、gallery sample 还是组合包。"
  - "native GPUI 的性能优势应该优先押注 table/tree/text/canvas/docking 中的哪些场景。"
  - "docs/gallery/story 是否应该成为 open-gpui 的独立 crate 或只保留 examples + xtask gates。"
