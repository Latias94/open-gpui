topic: "原生 UI 通用框架应该如何设计"
context:
  current_date: "2026-07-02"
  project: "open-gpui"
  framing: >
    调研 open-gpui 作为 native GPUI/Rust 通用 UI 框架时，应该如何参考
    shadcn、fret、Radix、Floating UI、React Aria、Rust/native UI 框架与 WebView
    桌面生态。重点不是复刻前端组件库，而是判断组件、primitive、registry、
    scaffold、docs/gallery、theme、a11y、performance 和 AI 时代分发方式的正确取舍。
  time_range: "2024 至今为主；经典框架、基础设计文档与长期稳定 API 不限时间"
  local_assumptions:
    - "open-gpui 已有 ui_components、foundation gallery、component_contract、theme schema 和 xtask verify 门禁。"
    - "本轮调研不预设 registry 必要性；registry、crate-only、scaffold recipe、copy-to-own、hybrid model 都要比较。"
    - "fret 与 gpui-component 位于 repo-ref/，deep 阶段应优先本地读取，不需要 Web 代替本地源码。"

items:
  - name: "shadcn/ui"
    category: "frontend_component_distribution"
    why: "copy-to-own、registry、CLI、docs 与 AI-friendly 组件分发的核心参考；需要判断这种模式迁移到 Rust/native UI 是否仍成立。"
    sources:
      - "https://ui.shadcn.com/docs"
      - "https://ui.shadcn.com/docs/registry"

  - name: "Radix UI Primitives"
    category: "headless_accessible_primitives"
    why: "无样式、可组合、a11y/focus/keyboard primitive 的标杆；适合作为 open-gpui 行为层边界参考。"
    sources:
      - "https://www.radix-ui.com/primitives"

  - name: "Floating UI"
    category: "positioning_collision_primitives"
    why: "tooltip、popover、menu、dropdown 的定位、collision、flip、shift、size、arrow、safe polygon 行为高度可迁移；应研究是否抽象成 GPUI overlay behavior kernel。"
    sources:
      - "https://floating-ui.com/docs/computeposition"
      - "https://floating-ui.com/docs/middleware"
      - "https://floating-ui.com/docs/useinteractions"

  - name: "Floating UI Rust crates"
    category: "native_port_candidate"
    why: "调研 floating-ui-core/dom 的 Rust 生态状态，判断是借鉴算法、直接依赖、fork，还是重写 GPUI-native positioning。"
    sources:
      - "https://github.com/floating-ui/floating-ui"
      - "https://crates.io/search?q=floating-ui"

  - name: "React Aria / React Aria Components"
    category: "accessible_behavior_library"
    why: "Adobe 对跨浏览器 a11y、interaction hooks、unstyled components 的系统化实践；可借鉴 API 表达和状态/action metadata。"
    sources:
      - "https://react-spectrum.adobe.com/react-aria/"
      - "https://react-spectrum.adobe.com/react-aria/components.html"

  - name: "Zag.js"
    category: "state_machine_primitives"
    why: "以 framework-agnostic state machine 表达 UI 行为；对 Rust 中 renderer-neutral state contract 很有参考价值。"
    sources:
      - "https://zagjs.com/"

  - name: "Ark UI"
    category: "headless_cross_framework_components"
    why: "基于 Zag 的跨 React/Vue/Solid/Svelte headless components；适合研究 multi-framework adapter 和 anatomy/part API。"
    sources:
      - "https://ark-ui.com/"

  - name: "Base UI"
    category: "unstyled_accessible_components"
    why: "较新的无样式 accessible React components，由 Floating UI/Radix/MUI 相关实践者推动；应作为 Radix 后继/竞争参考。"
    sources:
      - "https://base-ui.com/"

  - name: "fret"
    category: "local_reference_frontend_inspired_native_ui"
    why: "本地参考项目，包含 shadcn parity、组件 gallery、诊断脚本和前端组件库心智；deep 阶段应读 repo-ref/fret。"
    local_paths:
      - "repo-ref/fret"
      - "repo-ref/fret/apps/fret-ui-gallery"
      - "repo-ref/fret/docs/adr/0089-radix-aligned-headless-primitives-in-fret-components-ui.md"

  - name: "gpui-component"
    category: "local_reference_gpui_component_suite"
    why: "完整 GPUI 原生组件库，覆盖 story/docs/theme/assets/webview 等；用于判断 open-gpui 不该盲目追哪些应用级能力。"
    local_paths:
      - "repo-ref/gpui-component"
      - "repo-ref/gpui-component/crates/ui"
      - "repo-ref/gpui-component/crates/story"

  - name: "Zed UI / GPUI"
    category: "production_gpui_reference"
    why: "生产级 GPUI UI 的真实架构边界；应重点看哪些能力属于编辑器产品，哪些可沉淀为通用 framework。"
    local_paths:
      - "repo-ref/zed/crates/ui"

  - name: "SwiftUI"
    category: "native_declarative_ui"
    why: "声明式 native UI、state/data binding、environment、modifier、preview 的长期参考。"
    sources:
      - "https://developer.apple.com/xcode/swiftui/"

  - name: "Jetpack Compose"
    category: "native_declarative_ui"
    why: "Android/Kotlin 声明式 UI 与 state hoisting、modifier、material components 参考。"
    sources:
      - "https://developer.android.com/compose"

  - name: "Flutter"
    category: "cross_platform_rendered_ui"
    why: "跨平台自绘 UI、widget tree、theme、material/cupertino、hot reload 与生态分发参考。"
    sources:
      - "https://flutter.dev/"

  - name: "Slint"
    category: "rust_native_ui_framework"
    why: "Rust/C++/JS declarative UI toolkit，适合比较 DSL、native deployment、component composition 和 embedded/desktop 场景。"
    sources:
      - "https://slint.dev/"

  - name: "Iced"
    category: "rust_native_ui_framework"
    why: "Rust Elm-style GUI，适合比较 state/update/view 架构、widget ecosystem 和 renderer abstraction。"
    sources:
      - "https://iced.rs/"

  - name: "egui"
    category: "rust_immediate_mode_ui"
    why: "Rust immediate-mode GUI 代表；适合研究工具型 UI、低摩擦 API、调试/inspector 生态，但也要识别不适合复杂 native app 的边界。"
    sources:
      - "https://www.egui.rs/"

  - name: "Xilem / Linebender UI"
    category: "rust_reactive_native_ui_experiment"
    why: "Rust native reactive UI 与 masonry/xilem 架构探索；适合比较 data model、view reconciliation 和 renderer-neutral design。"
    sources:
      - "https://github.com/linebender/xilem"

  - name: "Makepad"
    category: "rust_native_ui_framework"
    why: "Rust live design、shader/native UI、cross-platform rendering 参考；适合比较 designer/developer workflow。"
    sources:
      - "https://makepad.nl/"

  - name: "Tauri"
    category: "webview_desktop_route"
    why: "Web 前端 + Rust backend 的主流轻量桌面路线；用于判断 open-gpui 应该避开哪些生态正面竞争，保留哪些互操作机会。"
    sources:
      - "https://tauri.app/"

  - name: "Electron"
    category: "webview_desktop_route"
    why: "Web 桌面生态事实标准之一；应作为生态速度、开发者心智、插件/组件复用能力的强参照，也作为性能/体积反例。"
    sources:
      - "https://www.electronjs.org/docs/latest/"

  - name: "TanStack Table / TanStack Virtual"
    category: "headless_data_interaction_library"
    why: "复杂 headless 行为库的 API、state、extension、performance 边界参考，尤其适合 open-gpui table/tree/virtualized list。"
    sources:
      - "https://tanstack.com/table/latest"
      - "https://tanstack.com/virtual/latest"

  - name: "Storybook / Chromatic"
    category: "docs_gallery_visual_testing"
    why: "组件 story、文档、视觉回归和交互测试事实标准；用于设计 native gallery 是否应承担 Storybook 类职责。"
    sources:
      - "https://storybook.js.org/docs"
      - "https://www.chromatic.com/docs/"

  - name: "Design Tokens Community Group / Style Dictionary"
    category: "design_token_pipeline"
    why: "跨平台 token format、transform、theme artifact 与 schema 管线参考；与 open-gpui theme schema 强相关。"
    sources:
      - "https://tr.designtokens.org/format/"
      - "https://styledictionary.com/"

  - name: "AccessKit"
    category: "native_accessibility_infrastructure"
    why: "Rust/native accessibility 关键基础设施；open-gpui 的 a11y contract 应与 AccessKit 能力、限制和平台映射一起设计。"
    sources:
      - "https://accesskit.dev/"

  - name: "Cargo / crates.io / cargo-generate / xtask scaffold"
    category: "rust_distribution_tooling"
    why: "Rust 生态分发与代码生成更自然依赖 Cargo；需要比较它是否比 shadcn registry 更适合 open-gpui。"
    sources:
      - "https://crates.io/"
      - "https://doc.rust-lang.org/cargo/"
      - "https://github.com/cargo-generate/cargo-generate"

  - name: "AI-era component distribution"
    category: "ai_native_ecosystem_design"
    why: "研究组件库如何提供 machine-readable metadata、recipes、tests、examples、constraints，让 AI 可靠生成和修改 native UI。"
    sources:
      - "https://ui.shadcn.com/docs"
      - "https://storybook.js.org/docs"

  - name: "Hybrid registry model"
    category: "open_gpui_candidate_architecture"
    why: "重点假设：open-gpui 可能不需要 shadcn 式源码 registry，而需要 crate + metadata registry + scaffold recipes + gallery/contract gate。deep 阶段要验证。"
    local_paths:
      - "crates/ui_components/src/component_contract"
      - "xtask/src/ui_contract.rs"
      - "docs/schemas/open-gpui-theme-v1.schema.json"

execution:
  batch_size: 4
  items_per_agent: 3
  output_dir: "native-ui-framework-design-research/results"
  suggested_next_command: "/research-deep native-ui-framework-design-research/outline.yaml native-ui-framework-design-research/fields.yaml"
