[workspace]
resolver = "2"

[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }

[package]
name = "open-gpui-test-support-consumer"
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
publish = false

[features]
default = ["test-support"]
test-support = ["open_gpui/test-support", "open_gpui_util/test-support"]
bench-support = ["open_gpui/bench-support", "dep:criterion"]
leak-detection = ["open_gpui/leak-detection"]

[dependencies]
open_gpui = { package = "open-gpui", path = "../../../crates/gpui", default-features = false }
open_gpui_scheduler = { package = "open-gpui-scheduler", path = "../../../crates/scheduler" }
open_gpui_util = { package = "open-gpui-util", path = "../../../crates/util" }
criterion = { version = "0.8.2", default-features = false, optional = true }
