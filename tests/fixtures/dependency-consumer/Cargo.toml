[workspace]
resolver = "2"

[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }

[package]
name = "open-gpui-dependency-consumer"
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
publish = false

[features]
debug-embed = ["open_gpui_util/debug-embed"]
avif-encoding = ["dep:image"]
profiler = ["open_gpui/profiler"]
wayland = ["open_gpui/wayland"]
vulkan-surface = ["wgpu/vulkan", "wgpu/wgsl"]
wgpu-renderer = ["dep:open_gpui_wgpu"]
bench-support = ["open_gpui/bench-support", "open_gpui_platform/bench-support", "dep:criterion", "dep:rand"]

[dependencies]
image = { version = "0.25.4", default-features = false, features = ["avif"], optional = true }
open_gpui = { package = "open-gpui", path = "../../../crates/gpui", default-features = false }
open_gpui_platform = { package = "open-gpui-platform", path = "../../../crates/gpui_platform", default-features = false }
open_gpui_web = { package = "open-gpui-web", path = "../../../crates/gpui_web", default-features = false }
open_gpui_ui_components = { package = "open-gpui-ui-components", path = "../../../crates/ui_components" }
open_gpui_docking = { package = "open-gpui-docking", path = "../../../crates/gpui_docking" }
open_gpui_http_client = { package = "open-gpui-http-client", path = "../../../crates/http_client" }
open_gpui_path = { package = "open-gpui-path", path = "../../../crates/path", features = ["serde"] }
open_gpui_util = { package = "open-gpui-util", path = "../../../crates/util" }
open_gpui_wgpu = { package = "open-gpui-wgpu", path = "../../../crates/gpui_wgpu", default-features = false, optional = true }
criterion = { version = "0.8.2", optional = true }
rand = { version = "0.9", optional = true }

# Application-owned layout pin and renderer source exercise standalone dependency resolution.
taffy = "=0.15.0"
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "cddb2f5d80dc0009b2ef6767635140cacf90a007", default-features = false, features = ["std"] }

[dev-dependencies]
anyhow = "1.0"
serde_json = "1.0"
tempfile = "3.20.0"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
async-process = "2.5.0"
smol = "2.0"
open_gpui_github_releases = { package = "open-gpui-github-releases", path = "../../../crates/github_releases" }
open_gpui_reqwest_client = { package = "open-gpui-reqwest-client", path = "../../../crates/reqwest_client" }
reqwest = { git = "https://github.com/zed-industries/reqwest.git", rev = "33bc764aa15ff7b200bf7c93bd96e24878d53e14", package = "zed-reqwest", version = "0.12.15-zed", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
open_gpui_platform = { package = "open-gpui-platform", path = "../../../crates/gpui_platform", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(target_os = "macos")'.dependencies]
open_gpui_platform = { package = "open-gpui-platform", path = "../../../crates/gpui_platform", default-features = false, features = ["font-kit"] }
open_gpui_apple = { package = "open-gpui-apple", path = "../../../crates/gpui_apple", default-features = false }
core-foundation = "=0.10.1"

[target.'cfg(target_os = "windows")'.dev-dependencies]
open_gpui_command = { package = "open-gpui-command", path = "../../../crates/open-gpui-command" }
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[[bench]]
name = "maintained_harness"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "randomized_tree"
harness = false
required-features = ["bench-support"]
