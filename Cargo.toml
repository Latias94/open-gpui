    "UIPasteboard",
    "UIResponder",
    "UIScene",
    "UISceneConfiguration",
    "UISceneDefinitions",
    "UISceneOptions",
    "UISceneSession",
    "UIScreen",
    "UITextInput",
    "UITextInputTraits",
    "UITouch",
    "UITraitCollection",
    "UIView",
    "UIViewController",
    "UIWindow",
    "UIWindowScene",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSGraphics"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = { version = "=0.3.2", default-features = false, features = ["CMSampleBuffer", "objc2-core-video"] }
objc2-core-text = "0.3"
objc2-core-video = "0.3"
objc2-foundation = "0.3"
objc2-metal = "0.3"
