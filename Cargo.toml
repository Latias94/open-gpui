itertools = "0.14.0"
libc = "0.2"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
mach2 = "0.5"
nix = "0.29"
objc2 = "0.6"
objc2-ui-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-quartz-core",
    "objc2-core-foundation",
    "NSText",
    "UIApplication",
    "UICommand",
    "UICornerConfiguration",
