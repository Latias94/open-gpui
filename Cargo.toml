postage = { version = "0.5", features = ["futures-traits"] }
pretty_assertions = { version = "1.3.0", features = ["unstable"] }
proc-macro2 = "1.0.93"
profiling = "1"
proptest = { version = "1.12.0", features = ["attr-macro"] }
quote = "1.0.9"
rand = "0.9"
rayon = "1.8"
