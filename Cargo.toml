[workspace]
resolver = "2"
members = [
    "crates/bench_metrics",
    "crates/canvas",
    "crates/collections",
    "crates/devtools",
    "crates/form",
    "crates/github_releases",
    "crates/open-gpui-command",
    "crates/gpui",
    "crates/gpui_apple",
    "crates/gpui_ios",
    "crates/gpui_docking",
    "crates/gpui_linux",
    "crates/gpui_macos",
    "crates/gpui_macros",
    "crates/gpui_platform",
    "crates/gpui_shared_string",
    "crates/gpui_tokio",
    "crates/gpui_util",
    "crates/gpui_web",
    "crates/gpui_wgpu",
    "crates/gpui_windows",
    "crates/http_client",
    "crates/http_client_tls",
    "crates/motion",
    "crates/path",
    "crates/resource",
    "crates/ui_components",
    "crates/ui_core",
    "crates/refineable",
    "crates/refineable/derive_refineable",
    "crates/reqwest_client",
    "crates/scheduler",
    "crates/sum_tree",
    "crates/util",
    "crates/util_macros",
    "crates/zlog",
    "crates/ztracing",
    "crates/ztracing_macro",
    "examples/canvas-notes",
    "examples/docking-minimal",
    "examples/docking-multiviewport",
    "examples/docking-native",
    "examples/dockspace-editor",
    "examples/smoke-native",
    "examples/ui-foundation-gallery",
    "examples/wgpu-native",
    "xtask",
]
exclude = [
    "repo-ref/*",
    "tests/fixtures/arena-miri",
    "tests/fixtures/dependency-consumer",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
authors = ["Mingzhen Zhuang <superfrankie621@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/Latias94/open-gpui"
homepage = "https://github.com/Latias94/open-gpui"
documentation = "https://docs.rs/open-gpui"
readme = "README.md"
publish = false

[workspace.dependencies]
open_gpui_bench_metrics = { package = "open-gpui-bench-metrics", version = "0.2.0", path = "crates/bench_metrics" }
open_gpui = { package = "open-gpui", version = "0.2.0", path = "crates/gpui", default-features = false }
open_gpui_apple = { package = "open-gpui-apple", version = "0.2.0", path = "crates/gpui_apple", default-features = false }
open_gpui_canvas = { package = "open-gpui-canvas", version = "0.2.0", path = "crates/canvas" }
open_gpui_collections = { package = "open-gpui-collections", version = "0.2.0", path = "crates/collections" }
open_gpui_command = { package = "open-gpui-command", version = "0.2.0", path = "crates/open-gpui-command" }
open_gpui_devtools = { package = "open-gpui-devtools", version = "0.2.0", path = "crates/devtools" }
open_gpui_docking = { package = "open-gpui-docking", version = "0.2.0", path = "crates/gpui_docking" }
open_gpui_form = { package = "open-gpui-form", version = "0.2.0", path = "crates/form" }
open_gpui_core_util = { package = "open-gpui-core-util", version = "0.2.0", path = "crates/gpui_util" }
open_gpui_ui_components = { package = "open-gpui-ui-components", version = "0.2.0", path = "crates/ui_components" }
open_gpui_ui_core = { package = "open-gpui-ui-core", version = "0.2.0", path = "crates/ui_core" }
open_gpui_http_client = { package = "open-gpui-http-client", version = "0.2.0", path = "crates/http_client" }
open_gpui_http_client_tls = { package = "open-gpui-http-client-tls", version = "0.2.0", path = "crates/http_client_tls" }
open_gpui_ios = { package = "open-gpui-ios", version = "0.2.0", path = "crates/gpui_ios", default-features = false }
open_gpui_linux = { package = "open-gpui-linux", version = "0.2.0", path = "crates/gpui_linux", default-features = false }
open_gpui_log = { package = "open-gpui-log", version = "0.2.0", path = "crates/zlog" }
open_gpui_macos = { package = "open-gpui-macos", version = "0.2.0", path = "crates/gpui_macos", default-features = false }
open_gpui_macros = { package = "open-gpui-macros", version = "0.2.0", path = "crates/gpui_macros" }
open_gpui_motion = { package = "open-gpui-motion", version = "0.2.0", path = "crates/motion" }
open_gpui_path = { package = "open-gpui-path", version = "0.2.0", path = "crates/path" }
open_gpui_platform = { package = "open-gpui-platform", version = "0.2.0", path = "crates/gpui_platform", default-features = false }
open_gpui_refineable = { package = "open-gpui-refineable", version = "0.2.0", path = "crates/refineable" }
open_gpui_refineable_derive = { package = "open-gpui-refineable-derive", version = "0.2.0", path = "crates/refineable/derive_refineable" }
open_gpui_reqwest_client = { package = "open-gpui-reqwest-client", version = "0.2.0", path = "crates/reqwest_client" }
open_gpui_resource = { package = "open-gpui-resource", version = "0.2.0", path = "crates/resource" }
open_gpui_scheduler = { package = "open-gpui-scheduler", version = "0.2.0", path = "crates/scheduler" }
open_gpui_shared_string = { package = "open-gpui-shared-string", version = "0.2.0", path = "crates/gpui_shared_string" }
open_gpui_sum_tree = { package = "open-gpui-sum-tree", version = "0.2.0", path = "crates/sum_tree" }
open_gpui_tracing = { package = "open-gpui-tracing", version = "0.2.0", path = "crates/ztracing" }
open_gpui_tracing_macro = { package = "open-gpui-tracing-macro", version = "0.2.0", path = "crates/ztracing_macro" }
open_gpui_util = { package = "open-gpui-util", version = "0.2.0", path = "crates/util" }
open_gpui_util_macros = { package = "open-gpui-util-macros", version = "0.2.0", path = "crates/util_macros" }
open_gpui_web = { package = "open-gpui-web", version = "0.2.0", path = "crates/gpui_web" }
open_gpui_wgpu = { package = "open-gpui-wgpu", version = "0.2.0", path = "crates/gpui_wgpu" }
open_gpui_windows = { package = "open-gpui-windows", version = "0.2.0", path = "crates/gpui_windows", default-features = false }

accesskit = { version = "0.24.0", features = ["enumn"] }
accesskit_macos = "0.26.0"
accesskit_unix = "0.21.0"
accesskit_windows = "0.32.1"
anyhow = "1.0.103"
arrayvec = "0.7.8"
ashpd = { version = "0.13", default-features = false, features = ["async-io", "notification", "open_uri", "file_chooser", "settings", "trash"] }
async-channel = { version = "2.5.0", default-features = false }
async-compression = { version = "0.4", features = ["bzip2", "gzip", "futures-io"] }
async-fs = "2.1"
async-process = "2.5.0"
async-std = { version = "1.12", features = ["unstable"] }
async-tar = { git = "https://github.com/zed-industries/async-tar", rev = "bd3ad6f89df9a9da7a8535958756d6bf465936a0" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
async_zip = { version = "0.0.18", features = ["deflate", "deflate64"] }
backtrace = "0.3"
bitflags = "2.6.0"
block2 = "0.6.2"
bytes = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
core-foundation = "0.10.0"
core-foundation-sys = "0.8.6"
core-graphics = "0.24"
core-text = "21"
dispatch2 = { version = "0.3.1", features = ["block2"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
ctor = "1.0.6"
derive_more = { version = "2.1.1", features = ["add", "add_assign", "deref", "deref_mut", "display", "from_str", "mul", "mul_assign", "not"] }
