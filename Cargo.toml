[workspace]
resolver = "2"
members = [
    "crates/gpui",
    "crates/gpui_base",
    "crates/gpui_docking",
    "crates/gpui_macros",
    "crates/gpui_platform",
    "crates/gpui_wgpu",
    "examples/docking-minimal",
    "examples/docking-multiviewport",
    "examples/docking-native",
    "examples/dockspace-editor",
    "examples/smoke-native",
    "examples/wgpu-native",
    "xtask",
]
exclude = [
    "repo-ref/*",
    "tests/fixtures/arena-miri",
    "tests/fixtures/dependency-consumer",
    "third_party/accesskit_windows",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
authors = ["Mingzhen Zhuang <superfrankie621@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/Latias94/open-gpui"
homepage = "https://github.com/Latias94/open-gpui"
documentation = "https://docs.rs/open-gpui"
readme = "README.md"
publish = false

[workspace.dependencies]
open_gpui = { package = "open-gpui", version = "0.2.0", path = "crates/gpui", default-features = false }
open_gpui_base = { package = "open-gpui-base", version = "0.2.0", path = "crates/gpui_base" }
open_gpui_docking = { package = "open-gpui-docking", version = "0.2.0", path = "crates/gpui_docking" }
open_gpui_macros = { package = "open-gpui-macros", version = "0.2.0", path = "crates/gpui_macros" }
open_gpui_platform = { package = "open-gpui-platform", version = "0.2.0", path = "crates/gpui_platform", default-features = false }
open_gpui_wgpu = { package = "open-gpui-wgpu", version = "0.2.0", path = "crates/gpui_wgpu" }

accesskit = { version = "0.24.0", features = ["enumn"] }
accesskit_macos = "0.26.0"
accesskit_unix = "0.21.0"
accesskit_windows = "0.32.1"
anyhow = "1.0.103"
ashpd = { version = "0.13", default-features = false, features = ["async-io", "open_uri", "file_chooser", "settings", "trash"] }
async-channel = { version = "2.5.0", default-features = false }
async-task = { version = "4.7.1", git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
backtrace = "0.3"
bitflags = "2.6.0"
block2 = "0.6.2"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
core-foundation = "0.10.0"
core-foundation-sys = "0.8.6"
core-text = "21"
criterion = { version = "0.8.2", features = ["html_reports"] }
ctor = "1.0.6"
derive_more = { version = "2.1.1", features = ["add", "add_assign", "deref", "deref_mut", "display", "from_str", "mul", "mul_assign", "not"] }
dockspace = { version = "0.1.0", git = "https://github.com/Latias94/dockspace", rev = "fed9130a5988acc1b98f5396083bd3b9bcd3fac6", default-features = false, features = ["serde"] }
dunce = "1.0"
env_logger = "0.11"
futures = "0.3.32"
futures-concurrency = "7.7.1"
heapless = "0.9.2"
heck = "0.5"
hdrhistogram = "7"
image = { version = "0.25.4", default-features = false, features = [
    "bmp",
    "dds",
    "exr",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "rayon",
    "tga",
    "tiff",
    "webp",
] }
inventory = "0.3.19"
itertools = "0.14.0"
libc = "0.2"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
mach2 = "0.5"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSGraphics"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-text = "0.3"
objc2-core-video = "0.3"
objc2-foundation = "0.3"
objc2-quartz-core = "0.3"
parking_lot = "0.12.1"
pollster = "0.4.0"
postage = { version = "0.5", features = ["futures-traits"] }
proc-macro2 = "1.0.93"
profiling = "1"
proptest = { version = "1.12.0", default-features = false, features = ["std", "bit-set", "attr-macro"] }
quote = "1.0.9"
rand = "0.9"
rayon = "1.8"
regex = "1.5"
rustc-hash = "2.1.0"
schemars = { version = "1.0", features = ["indexmap2"] }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0.221", features = ["derive", "rc"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
slotmap = "1.0.6"
smallvec = { version = "1.6", features = ["union", "const_new"] }
smol = "2.0"
stacksafe = "1.0.2"
strum = { version = "0.27.2", features = ["derive"] }
syn = { version = "2.0.101", features = ["full", "extra-traits", "visit-mut"] }
tempfile = "3.20.0"
thiserror = "2.0.12"
tracing = "0.1.40"
trybuild = "1.0"
unicode-bidi = "0.3.18"
icu_segmenter = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
unicode-segmentation = "1.10"
url = "2.5.9"
uuid = { version = "1.1.2", features = ["v4", "v5", "v7", "serde"] }
wasm-bindgen = "0.2.126"
web-time = "1.1.0"
wgpu = { version = "30.0.0", git = "https://github.com/gfx-rs/wgpu", rev = "cddb2f5d80dc0009b2ef6767635140cacf90a007", default-features = false }
which = "6.0.0"
windows = "0.62"
windows-core = "0.62"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_analyzer)", "cfg(nightly_coverage)", "cfg(feature, values(\"cargo-clippy\"))"] }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"

[patch.crates-io]
accesskit_windows = { path = "third_party/accesskit_windows" }
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }
