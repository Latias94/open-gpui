[package]
name = "open-gpui-wgpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
description = "wgpu renderer backend for Open GPUI."

[lints]
workspace = true

[lib]
path = "src/gpui_wgpu.rs"

[features]
default = []
font-kit = ["dep:font-kit"]
bench-support = ["open_gpui/bench-support", "dep:image"]
test-support = ["open_gpui/test-support", "dep:image"]

[dependencies]
open_gpui.workspace = true
anyhow.workspace = true
bytemuck = "1"
open_gpui_collections.workspace = true
cosmic-text = "0.19.0"
etagere = "0.3"
itertools.workspace = true
image = { workspace = true, optional = true }
log.workspace = true
parking_lot.workspace = true
profiling.workspace = true
raw-window-handle = "0.6"
smallvec.workspace = true
swash = "0.2.6"
unicode-bidi.workspace = true
unicode-segmentation.workspace = true
open_gpui_core_util.workspace = true

# Optional: only needed on platforms with multiple font sources (e.g. Linux)
font-kit = { package = "open-gpui-font-kit", version = "0.14.3", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
wgpu = { workspace = true, features = ["std", "metal", "gles", "vulkan", "wgsl", "webgpu"] }

[target.'cfg(not(any(target_os = "linux", target_os = "freebsd")))'.dependencies]
wgpu = { workspace = true, default-features = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
pollster.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
futures.workspace = true
wgpu = { workspace = true, features = ["webgl"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4.76"
web-sys = { version = "0.3.103", features = ["HtmlCanvasElement"] }
js-sys = "0.3.103"

[dev-dependencies]
criterion.workspace = true
open_gpui = { workspace = true, features = ["test-support"] }
image.workspace = true
naga = { git = "https://github.com/gfx-rs/wgpu", rev = "cddb2f5d80dc0009b2ef6767635140cacf90a007", features = ["wgsl-in"] }

[[bench]]
name = "layout_line"
harness = false
