[package]
name = "open-gpui-wgpu"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
description = "wgpu renderer backend for Open GPUI."

[lints]
workspace = true

[lib]
path = "src/gpui_wgpu.rs"

[features]
default = []
font-kit = ["dep:font-kit"]

[dependencies]
open_gpui.workspace = true
anyhow.workspace = true
bytemuck = "1"
open_gpui_collections.workspace = true
cosmic-text = "0.19.0"
etagere = "0.2"
itertools.workspace = true
log.workspace = true
parking_lot.workspace = true
profiling.workspace = true
raw-window-handle = "0.6"
smallvec.workspace = true
swash = "0.2.6"
unicode-segmentation.workspace = true
open_gpui_core_util.workspace = true
wgpu.workspace = true

# Optional: only needed on platforms with multiple font sources (e.g. Linux)
font-kit = { package = "open-gpui-font-kit", version = "0.14.3", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
pollster.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
js-sys = "0.3"

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "layout_line"
harness = false
