[package]
name = "open-gpui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Open GPUI's GPU-accelerated UI framework forked from Zed GPUI."
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
license.workspace = true
keywords = ["desktop", "gui", "immediate"]
categories = ["gui"]
autoexamples = false


[lints]
workspace = true

[features]
default = ["font-kit", "wayland", "x11", "windows-manifest"]
test-support = [
    "open_gpui_bench_metrics?/test-support",
    "open_gpui_collections/test-support",
    "open_gpui_http_client/test-support",
    "wayland",
    "x11",
    "proptest",
]
bench-support = ["profiler", "dep:criterion", "dep:open_gpui_bench_metrics"]
bench = ["bench-support"]
inspector = ["open_gpui_macros/inspector"]
leak-detection = []
font-kit = []
wayland = []
x11 = [
    "scap?/x11",
]
screen-capture = [
    "scap",
]
windows-manifest = ["dep:embed-resource"]
profiler = ["dep:hdrhistogram"]
stacker = ["dep:stacksafe"]
hot-reload = [
    "dep:async-tungstenite",
    "dep:dioxus-cli-config",
    "dep:dioxus-devtools-types",
    "dep:smol",
    "dep:subsecond",
]

[lib]
path = "src/gpui.rs"
doctest = false

[dependencies]
accesskit.workspace = true
anyhow.workspace = true
async-task.workspace = true
backtrace.workspace = true
bitflags.workspace = true
criterion = { workspace = true, optional = true }
open_gpui_bench_metrics = { workspace = true, optional = true }

open_gpui_collections.workspace = true
ctor.workspace = true
derive_more.workspace = true
etagere = "0.3"
futures.workspace = true
futures-concurrency.workspace = true
open_gpui_macros.workspace = true
open_gpui_shared_string.workspace = true
open_gpui_http_client.workspace = true
image.workspace = true
icu_segmenter.workspace = true
inventory.workspace = true
itertools.workspace = true
log.workspace = true
num_cpus = "1.13"
parking = "2.0.0"
parking_lot.workspace = true
postage.workspace = true
proptest = { workspace = true, optional = true }
chrono.workspace = true
profiling.workspace = true
rand.workspace = true
raw-window-handle = "0.6"
regex.workspace = true
open_gpui_refineable.workspace = true
open_gpui_scheduler.workspace = true
open_gpui_motion.workspace = true
resvg = { version = "0.46.0", default-features = false, features = [
    "text",
    "system-fonts",
    "memmap-fonts",
    "raster-images"
] }
usvg = { version = "0.46.0", default-features = false }
ttf-parser = "0.25"
open_gpui_util_macros.workspace = true
schemars.workspace = true
seahash = "4.1"
serde.workspace = true
serde_json.workspace = true
slotmap.workspace = true
smallvec.workspace = true
stacksafe = { workspace = true, optional = true }
strum.workspace = true
open_gpui_sum_tree.workspace = true
taffy = { version = "0.15", default-features = false, features = [
    "std",
    "taffy_tree",
    "flexbox",
    "grid",
    "block_layout",
    "float_layout",
    "content_size",
] }
thiserror.workspace = true
open_gpui_core_util.workspace = true
hdrhistogram = { workspace = true, optional = true }
waker-fn = "1.2.0"
lyon = "1.0"
pin-project = "1.1.10"
spin = "0.12.3"
pollster.workspace = true
url.workspace = true
uuid.workspace = true
web-time.workspace = true
heapless.workspace = true
unicode-segmentation.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows", target_os = "ios"))'.dependencies]
async-tungstenite = { version = "0.33", optional = true }
dioxus-cli-config = { version = "=0.7.10", optional = true }
dioxus-devtools-types = { version = "=0.7.10", optional = true }
smol = { workspace = true, optional = true }
subsecond = { version = "=0.7.10", optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
async-channel.workspace = true
getrandom = { version = "0.4.3", features = ["wasm_js"] }
uuid = { workspace = true, features = ["js"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
async-channel = { workspace = true, features = ["std"] }


[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2-core-foundation.workspace = true
objc2-core-video.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "macos"))'.dependencies]
pathfinder_geometry = "0.5"

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "windows"))'.dependencies]
scap = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc.workspace = true


[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_System_WindowsProgramming"] }


[dev-dependencies]
backtrace.workspace = true
open_gpui_collections = { workspace = true, features = ["test-support"] }
env_logger.workspace = true
open_gpui_core_util = { workspace = true }
lyon = { version = "1.0", features = ["extra"] }
proptest = { workspace = true }
rand.workspace = true
open_gpui_scheduler = { workspace = true, features = ["test-support"] }
syn.workspace = true
trybuild.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
open_gpui_http_client = { workspace = true, features = ["test-support"] }

[build-dependencies]
embed-resource = { version = "3.0.11", optional = true }
