[package]
name = "open-gpui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Open GPUI's GPU-accelerated UI framework forked from Zed GPUI."
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
license.workspace = true
keywords = ["desktop", "gui", "immediate"]
categories = ["gui"]
autoexamples = false
autobenches = false


[lints]
workspace = true

[features]
default = ["font-kit", "wayland", "x11", "windows-manifest"]
test-support = [
    "wayland",
    "x11",
    "proptest",
]
inspector = ["open_gpui_macros/inspector"]
leak-detection = []
wasm-threads = ["dep:wasm_thread", "flume/spin"]
font-kit = []
wayland = []
x11 = []
windows-manifest = ["dep:embed-resource"]
profiler = ["dep:hdrhistogram"]
stacker = ["dep:stacksafe"]
hot-reload = [
    "dep:async-tungstenite",
    "dep:dioxus-cli-config",
    "dep:dioxus-devtools-types",
    "dep:smol",
    "dep:subsecond",
]

[lib]
path = "src/gpui.rs"
doctest = false

[dependencies]
accesskit.workspace = true
anyhow.workspace = true
async-task.workspace = true
backtrace.workspace = true
bitflags.workspace = true
ctor.workspace = true
derive_more.workspace = true
etagere = "0.3"
flume = "0.12"
futures.workspace = true
futures-concurrency.workspace = true
open_gpui_macros.workspace = true
image.workspace = true
icu_segmenter.workspace = true
inventory.workspace = true
itertools.workspace = true
log.workspace = true
num_cpus = "1.13"
parking = "2.0.0"
parking_lot.workspace = true
postage.workspace = true
proptest = { workspace = true, optional = true }
chrono = { workspace = true, features = ["now", "wasmbind"] }
profiling.workspace = true
rand.workspace = true
raw-window-handle = "0.6"
regex.workspace = true
resvg = { version = "0.46.0", default-features = false, features = [
    "text",
    "system-fonts",
    "memmap-fonts",
    "raster-images"
] }
usvg = { version = "0.46.0", default-features = false }
ttf-parser = "0.25"
rustc-hash.workspace = true
schemars.workspace = true
seahash = "4.1"
serde.workspace = true
serde_json.workspace = true
slotmap.workspace = true
smallvec.workspace = true
smol_str = { version = "0.3.6", default-features = false, features = ["serde"] }
stacksafe = { workspace = true, optional = true }
strum.workspace = true
tracing.workspace = true
taffy = { version = "0.15", default-features = false, features = [
    "std",
    "taffy_tree",
    "flexbox",
    "grid",
    "block_layout",
    "float_layout",
    "content_size",
] }
thiserror.workspace = true
hdrhistogram = { workspace = true, optional = true }
waker-fn = "1.2.0"
lyon_path = "1.0.19"
tiny-skia-path = "0.11"
pin-project = "1.1.10"
spin = "0.12.3"
pollster.workspace = true
uuid.workspace = true
web-time.workspace = true
heapless.workspace = true
unicode-segmentation.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows", target_os = "ios"))'.dependencies]
async-tungstenite = { version = "0.33", optional = true }
dioxus-cli-config = { version = "=0.7.10", optional = true }
dioxus-devtools-types = { version = "=0.7.10", optional = true }
smol = { workspace = true, optional = true }
subsecond = { version = "=0.7.10", optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
async-channel.workspace = true
getrandom = { version = "0.4.3", features = ["wasm_js"] }
uuid = { workspace = true, features = ["js"] }
wasm_thread = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
async-channel = { workspace = true, features = ["std"] }
proptest = { workspace = true, optional = true, features = ["fork", "timeout"] }


[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "macos"))'.dependencies]
pathfinder_geometry = "0.5"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc.workspace = true


[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_System_WindowsProgramming"] }


[dev-dependencies]
backtrace.workspace = true
env_logger.workspace = true
lyon_extra = "1.1.0"
rand.workspace = true
rayon.workspace = true
syn.workspace = true
tempfile.workspace = true
trybuild.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = { workspace = true, features = ["fork", "timeout"] }

[build-dependencies]
embed-resource = { version = "3.0.11", optional = true }
