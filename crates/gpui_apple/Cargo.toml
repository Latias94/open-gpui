[package]
name = "open-gpui-apple"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
description = "Shared Apple rendering, dispatch and system services for Open GPUI."

[lints]
workspace = true

[lib]
path = "src/gpui_apple.rs"
doctest = false

[features]
default = []
test-support = ["open_gpui/test-support"]
bench-support = ["open_gpui/bench-support"]
runtime_shaders = []
font-kit = ["dep:font-kit", "dep:core-text", "dep:objc2-core-text", "dep:pathfinder_geometry"]

[dependencies]
open_gpui.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
anyhow.workspace = true
async-task.workspace = true
block2.workspace = true
core-foundation.workspace = true
core-foundation-sys.workspace = true
core-graphics.workspace = true
core-text = { workspace = true, optional = true }
dispatch2.workspace = true
etagere = "0.3"
font-kit = { package = "open-gpui-font-kit", version = "0.14.3", optional = true, features = ["source"] }
futures.workspace = true
image.workspace = true
libc.workspace = true
log.workspace = true
mach2.workspace = true
objc2.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics = { workspace = true, features = ["CGColorSpace"] }
objc2-core-text = { workspace = true, optional = true }
objc2-core-video.workspace = true
objc2-foundation.workspace = true
objc2-metal.workspace = true
objc2-quartz-core.workspace = true
objc2-security.workspace = true
open_gpui_collections.workspace = true
open_gpui_scheduler.workspace = true
open_gpui_util.workspace = true
parking_lot.workspace = true
pathfinder_geometry = { version = "0.5", optional = true }
smallvec.workspace = true
thiserror.workspace = true

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dev-dependencies]
open_gpui = { workspace = true, features = ["test-support"] }
