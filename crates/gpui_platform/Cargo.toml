[package]
name = "open-gpui-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
description = "Native desktop platforms for Open GPUI."

[lints]
workspace = true

[lib]
path = "src/gpui_platform.rs"

[[example]]
name = "image"
path = "../gpui/examples/image/image.rs"

[[example]]
name = "window_shadow"
path = "../gpui/examples/window_shadow.rs"

[[example]]
name = "a11y"
path = "../gpui/examples/a11y.rs"

[[example]]
name = "window"
path = "../gpui/examples/window.rs"

[[example]]
name = "window_positioning"
path = "../gpui/examples/window_positioning.rs"

[[example]]
name = "testing"
path = "../gpui/examples/testing.rs"
test = true
required-features = ["test-support"]

[[example]]
name = "svg_animation"
path = "examples/svg_animation.rs"

[[example]]
name = "toggle_headless"
path = "examples/toggle_headless.rs"

[[example]]
name = "native_window_appearance"
path = "examples/native_window_appearance.rs"
harness = false
test = false

[[example]]
name = "native_windowing"
path = "examples/native_windowing.rs"
harness = false
test = false

[[example]]
name = "native_termination"
path = "examples/native_termination.rs"
harness = false
test = false

[[example]]
name = "native_layer_shutdown"
path = "examples/native_layer_shutdown.rs"
harness = false
test = false

[features]
default = []
font-kit = ["dep:font-kit", "dep:core-text", "dep:objc2-core-text", "dep:pathfinder_geometry"]
inspector = ["open_gpui/inspector"]
profiler = ["open_gpui/profiler"]
test-support = ["open_gpui/test-support", "open_gpui_wgpu/test-support"]
wayland = [
    "dep:calloop-wayland-source",
    "dep:filedescriptor",
    "dep:open",
    "dep:wayland-backend",
    "dep:wayland-client",
    "dep:wayland-cursor",
    "dep:wayland-protocols",
    "dep:wayland-protocols-plasma",
    "dep:wayland-protocols-wlr",
    "ashpd/wayland",
    "open_gpui/wayland",
    "open_gpui_wgpu/font-kit",
    "xkbcommon/wayland",
]
x11 = [
    "dep:ashpd",
    "dep:as-raw-xcb-connection",
    "dep:filedescriptor",
    "dep:open",
    "dep:x11rb",
    "dep:xim",
    "open_gpui_wgpu/font-kit",
    "xkbcommon/x11",
]

[dependencies]
anyhow.workspace = true
open_gpui.workspace = true
open_gpui_wgpu.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
accesskit.workspace = true
accesskit_macos.workspace = true
async-task.workspace = true
bitflags.workspace = true
block2.workspace = true
core-foundation.workspace = true
core-foundation-sys.workspace = true
core-graphics = "0.24"
core-text = { workspace = true, optional = true }
ctor.workspace = true
derive_more.workspace = true
dispatch2 = { version = "0.3.1", features = ["block2", "objc2"] }
font-kit = { package = "open-gpui-font-kit", version = "0.14.3", optional = true, features = ["source"] }
foreign-types = "0.5"
futures.workspace = true
image.workspace = true
itertools.workspace = true
libc.workspace = true
log.workspace = true
mach2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
    "NSAlert",
    "NSAppearance",
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSCursor",
    "NSDocumentController",
    "NSDragging",
    "NSDraggingItem",
    "NSEvent",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSOpenPanel",
    "NSPanel",
    "NSPasteboard",
    "NSResponder",
    "NSRunningApplication",
    "NSSavePanel",
    "NSScreen",
    "NSScroller",
    "NSTrackingArea",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWindowRestoration",
    "NSWorkspace",
    "block2",
    "objc2-core-foundation",
    "objc2-quartz-core",
    "objc2-uniform-type-identifiers",
] }
objc2-core-foundation.workspace = true
objc2-core-graphics = { workspace = true, features = ["CGColor", "CGDirectDisplay", "objc2"] }
objc2-core-text = { workspace = true, optional = true }
objc2-core-video.workspace = true
objc2-foundation.workspace = true
objc2-quartz-core.workspace = true
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTCoreTypes", "UTType"] }
parking_lot.workspace = true
pathfinder_geometry = { version = "0.5", optional = true }
raw-window-handle = "0.6"
semver.workspace = true
serde_json.workspace = true
smallvec.workspace = true
strum.workspace = true
thiserror.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
accesskit.workspace = true
accesskit_windows.workspace = true
dunce.workspace = true
futures.workspace = true
image.workspace = true
itertools.workspace = true
log.workspace = true
open_gpui = { workspace = true, features = ["windows-manifest"] }
parking_lot.workspace = true
rand.workspace = true
raw-window-handle = { version = "0.6", features = ["std"] }
smallvec.workspace = true
uuid.workspace = true
which.workspace = true
windows = { workspace = true, features = [
    "UI_ViewManagement",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_DirectManipulation",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core.workspace = true
windows-numerics = "0.3"
windows-registry = "0.5"

[target.'cfg(all(any(target_os = "linux", target_os = "freebsd"), not(target_env = "ohos")))'.dependencies]
accesskit.workspace = true
accesskit_unix.workspace = true
as-raw-xcb-connection = { version = "1", optional = true }
ashpd = { workspace = true, optional = true, features = ["inhibit"] }
bytemuck = "1"
calloop = "0.14.3"
calloop-wayland-source = { version = "0.4.1", optional = true }
filedescriptor = { version = "0.8.2", optional = true }
futures.workspace = true
image.workspace = true
itertools.workspace = true
libc.workspace = true
log.workspace = true
open = { version = "5.3.6", optional = true }
parking_lot.workspace = true
pollster.workspace = true
profiling.workspace = true
raw-window-handle = "0.6"
smallvec.workspace = true
smol.workspace = true
strum.workspace = true
swash = { version = "0.2.6" }
url.workspace = true
uuid.workspace = true
wayland-backend = { version = "0.3.15", features = [
    "client_system",
    "dlopen",
], optional = true }
wayland-client = { version = "0.31.11", optional = true }
wayland-cursor = { version = "0.31.11", optional = true }
wayland-protocols = { version = "0.32.10", features = [
    "client",
    "staging",
    "unstable",
], optional = true }
wayland-protocols-plasma = { version = "0.3.9", features = [
    "client",
], optional = true }
wayland-protocols-wlr = { version = "0.3.9", features = [
    "client",
], optional = true }
x11rb = { version = "0.13.1", features = [
    "allow-unsafe-code",
    "xkb",
    "randr",
    "xinput",
    "cursor",
    "resource_manager",
    "sync",
    "dri3",
], optional = true }
xim = { version = "=0.5.0", features = [
    "x11rb-xcb",
    "x11rb-client",
], optional = true }
xkbcommon = { version = "0.8.0", default-features = false, optional = true }

[dev-dependencies]
async-channel.workspace = true
env_logger.workspace = true
futures.workspace = true
log.workspace = true
rand.workspace = true
open_gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dev-dependencies]
open_gpui_wgpu = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "=5.16.0", default-features = false, features = ["async-io"] }
