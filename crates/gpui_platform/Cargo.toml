[package]
name = "open-gpui-platform"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
publish.workspace = true
description = "Cross-platform backend selector for Open GPUI."

[lints]
workspace = true

[lib]
path = "src/gpui_platform.rs"

[features]
default = []
font-kit = ["open_gpui_macos/font-kit"]
test-support = ["open_gpui/test-support", "open_gpui_macos/test-support"]
screen-capture = ["open_gpui/screen-capture", "open_gpui_macos/screen-capture", "open_gpui_windows/screen-capture", "open_gpui_linux/screen-capture"]
runtime_shaders = ["open_gpui_macos/runtime_shaders"]
wayland = ["open_gpui_linux/wayland"]
x11 = ["open_gpui_linux/x11"]

[dependencies]
open_gpui.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
open_gpui_macos.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
open_gpui_windows.workspace = true
open_gpui = { workspace = true, features = ["windows-manifest"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
open_gpui_linux.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
open_gpui_web.workspace = true
console_error_panic_hook = "0.1.7"
