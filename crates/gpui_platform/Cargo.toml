[package]
name = "open-gpui-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
description = "Cross-platform backend selector for Open GPUI."

[lints]
workspace = true

[lib]
path = "src/gpui_platform.rs"

[[example]]
name = "image"
path = "../gpui/examples/image/image.rs"

[[example]]
name = "window_shadow"
path = "../gpui/examples/window_shadow.rs"

[[example]]
name = "a11y"
path = "../gpui/examples/a11y.rs"

[[example]]
name = "window"
path = "../gpui/examples/window.rs"

[[example]]
name = "window_positioning"
path = "../gpui/examples/window_positioning.rs"

[[example]]
name = "testing"
path = "../gpui/examples/testing.rs"
test = true
required-features = ["test-support"]

[[example]]
name = "system_notifications"
path = "examples/system_notifications.rs"

[[example]]
name = "svg_animation"
path = "examples/svg_animation.rs"

[[example]]
name = "toggle_headless"
path = "examples/toggle_headless.rs"

[features]
inspector = ["open_gpui/inspector"]
default = []
font-kit = ["open_gpui_macos/font-kit", "open_gpui_apple/font-kit"]
test-support = ["open_gpui/test-support", "open_gpui_macos/test-support", "open_gpui_apple/test-support", "open_gpui_windows/test-support", "open_gpui_linux/test-support", "dep:open_gpui_wgpu", "open_gpui_wgpu?/test-support"]
runtime_shaders = ["open_gpui_macos/runtime_shaders", "open_gpui_apple/runtime_shaders"]
wayland = ["open_gpui_linux/wayland"]
x11 = ["open_gpui_linux/x11"]

[dependencies]
anyhow.workspace = true
open_gpui.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
open_gpui_macos.workspace = true
open_gpui_apple.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
open_gpui_windows.workspace = true
open_gpui = { workspace = true, features = ["windows-manifest"] }

[target.'cfg(all(any(target_os = "linux", target_os = "freebsd"), not(target_env = "ohos")))'.dependencies]
open_gpui_linux.workspace = true
open_gpui_wgpu = { workspace = true, optional = true }

[dev-dependencies]
async-channel.workspace = true
env_logger.workspace = true
futures.workspace = true
log.workspace = true
rand.workspace = true
