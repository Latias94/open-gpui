[package]
name = "open-gpui-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
description = "WebAssembly platform backend for Open GPUI."
autoexamples = false

[lints]
workspace = true

[features]
default = []
multithreaded = ["dep:wasm_thread", "open_gpui/wasm-threads"]

[lib]
path = "src/gpui_web.rs"

[dependencies]
open_gpui.workspace = true

[dev-dependencies]
open_gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(target_family = "wasm")'.dependencies]
parking_lot = { workspace = true, features = ["nightly"] }
open_gpui_core_util.workspace = true
open_gpui_wgpu.workspace = true
open_gpui_http_client.workspace = true
anyhow.workspace = true
async-channel.workspace = true
futures.workspace = true
log.workspace = true
smallvec.workspace = true
uuid.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4.76"
web-time.workspace = true
console_error_panic_hook = "0.1.7"
damascene-fonts = { version = "0.4.6", default-features = false, features = [
    "inter",
    "jetbrains-mono",
] }
js-sys = "0.3.103"
raw-window-handle = "0.6"
wasm_thread = { workspace = true, optional = true }
web-sys = { version = "0.3.103", features = [
    "console",
    "Blob",
    "Clipboard",
    "ClipboardEvent",
    "ClipboardItem",
    "CompositionEvent",
    "CssStyleDeclaration",
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "Document",
    "DomRect",
    "DragEvent",
    "Element",
    "EventTarget",
    "File",
    "FileList",
    "FocusOptions",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlTextAreaElement",
    "IdleDeadline",
    "IdleRequestOptions",
    "InputEvent",
    "KeyboardEvent",
    "MediaQueryList",
    "MediaQueryListEvent",
    "MouseEvent",
    "Navigator",
    "PointerEvent",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "ReadableStreamReadResult",
    "ResizeObserver",
    "ResizeObserverBoxOptions",
    "ResizeObserverEntry",
    "ResizeObserverSize",
    "ResizeObserverOptions",
    "Screen",
    "Storage",
    "VisualViewport",
    "Headers",
    "Request",
    "RequestCredentials",
    "RequestInit",
    "RequestRedirect",
    "Response",
    "WheelEvent",
    "Window",
] }
