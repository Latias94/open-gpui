[workspace]

[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }

[package]
name = "smoke_web"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "smoke_web"
path = "main.rs"

[dependencies]
js-sys = "0.3.103"
open_gpui_docking = { package = "open-gpui-docking", path = "../../../gpui_docking" }
open_gpui = { package = "open-gpui", path = "../../../gpui", default-features = false }
open_gpui_platform = { package = "open-gpui-platform", path = "../../../gpui_platform" }
open_gpui_web = { package = "open-gpui-web", path = "../..", default-features = false }
open_gpui_wgpu = { package = "open-gpui-wgpu", path = "../../../gpui_wgpu", default-features = false }
wasm-bindgen = "0.2.126"
web-sys = { version = "0.3.103", features = ["Document", "DomStringMap", "Element", "HtmlElement", "Location", "UrlSearchParams", "Window"] }
