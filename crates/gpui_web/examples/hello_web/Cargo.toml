[workspace]

[patch.crates-io]
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }

[package]
name = "hello_web"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "hello_web"
path = "main.rs"

[[bin]]
name = "http-client-test"
path = "http_client_test.rs"

[[bin]]
name = "queue-test"
path = "queue_test.rs"

[dependencies]
anyhow = "1"
futures = "0.3"
js-sys = "0.3.103"
open_gpui = { package = "open-gpui", path = "../../../gpui", default-features = false }
open_gpui_http_client = { package = "open-gpui-http-client", path = "../../../http_client" }
open_gpui_web = { package = "open-gpui-web", path = "../..", features = ["multithreaded"] }
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
wasm_thread = { git = "https://github.com/zed-industries/wasm_thread", rev = "0cf96c7708dfb97ccf3da50347e25edcf75d6937", features = ["es_modules"] }
web-time = "1"

[dependencies.open_gpui_platform]
package = "open-gpui-platform"
path = "../../../gpui_platform"
features = ["web-multithreaded"]
