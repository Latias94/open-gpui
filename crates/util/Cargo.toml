[package]
name = "open-gpui-util"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
publish.workspace = true
description = "General-purpose utility helpers used by Open GPUI."


[lints]
workspace = true

[lib]
path = "src/util.rs"
doctest = true

[features]
test-support = ["rand", "open_gpui_util_macros"]

[dependencies]
anyhow.workspace = true
async_zip.workspace = true
open_gpui_collections.workspace = true
dunce.workspace = true
futures-lite.workspace = true
futures.workspace = true
globset.workspace = true
itertools.workspace = true
log.workspace = true
rand = { workspace = true, optional = true }
regex.workspace = true
rust-embed.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_lenient.workspace = true
shlex.workspace = true
take-until.workspace = true
tempfile.workspace = true
unicase.workspace = true
url.workspace = true
percent-encoding.workspace = true
open_gpui_util_macros = { workspace = true, optional = true }
open_gpui_core_util.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
smol.workspace = true
which.workspace = true
async-fs.workspace = true
walkdir.workspace = true
dirs.workspace = true

[target.'cfg(unix)'.dependencies]
command-fds = "0.3.1"
libc.workspace = true
nix = { workspace = true, features = ["user"] }

[target.'cfg(target_os = "macos")'.dependencies]
mach2.workspace = true

[target.'cfg(windows)'.dependencies]
tendril = "0.4.3"

[dev-dependencies]
rand.workspace = true
open_gpui_util_macros.workspace = true
pretty_assertions.workspace = true
