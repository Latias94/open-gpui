[package]
name = "open-gpui-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
description = "macOS platform backend for Open GPUI."

[lints]
workspace = true

[lib]
path = "src/gpui_macos.rs"

[[example]]
name = "native_window_appearance"
path = "examples/native_window_appearance.rs"
harness = false
test = false

[[example]]
name = "native_windowing"
path = "examples/native_windowing.rs"
harness = false
test = false

[features]
default = ["open_gpui/default"]
test-support = ["open_gpui/test-support", "open_gpui_apple/test-support"]
bench-support = ["open_gpui/bench-support", "open_gpui_apple/bench-support"]
runtime_shaders = ["open_gpui_apple/runtime_shaders"]
font-kit = ["open_gpui_apple/font-kit"]
screen-capture = ["open_gpui/screen-capture", "dep:objc2-core-media", "dep:objc2-screen-capture-kit"]

[dependencies]
open_gpui.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
accesskit.workspace = true
accesskit_macos.workspace = true
anyhow.workspace = true
bitflags.workspace = true
block2.workspace = true
open_gpui_collections.workspace = true
core-foundation.workspace = true
core-foundation-sys.workspace = true
core-graphics = "0.24"
ctor.workspace = true
derive_more.workspace = true
dispatch2 = { version = "0.3.1", features = ["block2", "objc2"] }
foreign-types = "0.5"
futures.workspace = true
image.workspace = true
itertools.workspace = true
libc.workspace = true
log.workspace = true
open_gpui_apple.workspace = true
open_gpui_scheduler.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
    "NSAlert",
    "NSAppearance",
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSCursor",
    "NSDocumentController",
    "NSDragging",
    "NSDraggingItem",
    "NSEvent",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSOpenPanel",
    "NSPanel",
    "NSPasteboard",
    "NSResponder",
    "NSRunningApplication",
    "NSSavePanel",
    "NSScreen",
    "NSScroller",
    "NSTrackingArea",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWindowRestoration",
    "NSWorkspace",
    "block2",
    "objc2-core-foundation",
    "objc2-uniform-type-identifiers",
] }
objc2-core-foundation.workspace = true
objc2-core-graphics = { workspace = true, features = ["CGColor", "CGDirectDisplay", "objc2"] }
objc2-core-media = { workspace = true, optional = true }
objc2-core-video.workspace = true
objc2-foundation.workspace = true
objc2-quartz-core.workspace = true
objc2-screen-capture-kit = { workspace = true, optional = true }
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTCoreTypes", "UTType"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "UNNotification",
    "UNNotificationAction",
    "UNNotificationCategory",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }
parking_lot.workspace = true
raw-window-handle = "0.6"
semver.workspace = true
smallvec.workspace = true
strum.workspace = true
open_gpui_util.workspace = true
uuid.workspace = true

# When this crate is itself being tested (cargo test -p gpui_macos), its own
# cfg(test) flag enables impls of test-only traits like PlatformHeadlessRenderer
# and PlatformWindow::render_to_image. Those traits/methods only exist in gpui
# when gpui's `test-support` feature is on, so we have to turn that feature on
# as a dev-dependency. The `cfg(test)` flag of a dependent crate doesn't
# propagate to its dependencies, but dev-dependencies do, so this is the
# correct way to enable the feature exactly when needed.
[target.'cfg(target_os = "macos")'.dev-dependencies]
open_gpui = { workspace = true, features = ["test-support"] }
