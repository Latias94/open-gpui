[package]
name = "open-gpui-devtools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
description = "Read-only inspection snapshots and local devtools surfaces for Open GPUI applications."

[lib]
path = "src/lib.rs"

[features]
default = []
command = ["dep:open_gpui_command"]
docking = ["dep:open_gpui_docking"]
form = ["dep:open_gpui_form"]
gpui = ["dep:open_gpui", "ui-components"]
motion = ["dep:open_gpui_motion"]
resource = ["dep:open_gpui_resource"]
ui-components = ["dep:open_gpui_ui_components", "dep:open_gpui_ui_core"]

[dependencies]
open_gpui = { workspace = true, optional = true }
open_gpui_command = { workspace = true, optional = true }
open_gpui_docking = { workspace = true, optional = true }
open_gpui_form = { workspace = true, optional = true }
open_gpui_motion = { workspace = true, optional = true }
open_gpui_resource = { workspace = true, optional = true }
open_gpui_ui_components = { workspace = true, optional = true }
open_gpui_ui_core = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
open_gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
