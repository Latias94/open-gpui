[package]
name = "open-gpui-docking"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
authors.workspace = true
description = "Retained docking views and native transport for a shared dockspace session."
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
license.workspace = true
keywords = ["desktop", "gui", "docking"]
categories = ["gui"]

[lints]
workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[[bench]]
name = "shared_session_cpu"
harness = false
required-features = ["test-support"]

[features]
default = []
test-support = ["open_gpui/test-support"]

[dependencies]
anyhow.workspace = true
dockspace.workspace = true
open_gpui.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
web-time.workspace = true

[dev-dependencies]
open_gpui = { workspace = true, features = ["test-support"] }
