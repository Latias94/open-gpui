[package]
name = "open-gpui-ios-consumer"
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace]

[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }

[dependencies]
open_gpui = { package = "open-gpui", path = "../../../gpui", default-features = false }
open_gpui_ios = { package = "open-gpui-ios", path = "../..", default-features = false }
open_gpui_platform = { package = "open-gpui-platform", path = "../../../gpui_platform", default-features = false }
