[package]
name = "open-gpui-docking-multiviewport"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
publish = false
description = "Shared-session multi-window docking and persistence example for Open GPUI."

[[bin]]
name = "open-gpui-docking-multiviewport"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
env_logger.workspace = true
log.workspace = true
open_gpui.workspace = true
open_gpui_docking.workspace = true
open_gpui_platform = { workspace = true, features = ["font-kit"] }

[dev-dependencies]
open_gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
