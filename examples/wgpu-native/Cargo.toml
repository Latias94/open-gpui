[package]
name = "open-gpui-wgpu-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
publish = false
description = "Application-owned WGPU rendering with GPUI or application-owned Win32 hosts."

[target.'cfg(target_os = "windows")'.dependencies]
anyhow.workspace = true
open_gpui = { workspace = true, features = ["windows-manifest"] }
open_gpui_wgpu.workspace = true
open_gpui_platform.workspace = true
raw-window-handle = "0.6"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
