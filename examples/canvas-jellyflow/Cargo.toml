[package]
name = "open-gpui-canvas-jellyflow"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
publish = false
description = "Native Jellyflow graph projection example for open-gpui-canvas."

[[bin]]
name = "open-gpui-canvas-jellyflow"
path = "src/main.rs"

[dependencies]
jellyflow = { path = "../../../../crates/jellyflow" }
jellyflow-open-gpui = { path = "../../../../crates/jellyflow-open-gpui" }
open_gpui.workspace = true
open_gpui_canvas.workspace = true
open_gpui_platform = { workspace = true, features = ["font-kit"] }
open_gpui_ui_components.workspace = true
open_gpui_ui_core.workspace = true
serde_json.workspace = true

[dev-dependencies]
image.workspace = true
open_gpui = { workspace = true, features = ["test-support"] }
open_gpui_platform = { workspace = true, features = ["font-kit", "test-support"] }

[lints]
workspace = true
