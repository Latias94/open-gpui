[package]
name = "open-gpui-docking-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
publish = false
description = "Native docking smoke example for Open GPUI."

[[bin]]
name = "open-gpui-docking-native"
path = "src/main.rs"

[dependencies]
env_logger.workspace = true
log.workspace = true
open_gpui.workspace = true
open_gpui_devtools = { workspace = true, features = ["docking", "gpui"] }
open_gpui_docking.workspace = true
open_gpui_platform = { workspace = true, features = ["font-kit"] }
open_gpui_ui_components.workspace = true
open_gpui_ui_core.workspace = true

[dev-dependencies]
image.workspace = true
open_gpui = { workspace = true, features = ["test-support"] }
serde.workspace = true
serde_json.workspace = true
toml = "1.1.2"

[target.'cfg(windows)'.dev-dependencies]
anyhow.workspace = true
futures.workspace = true
open_gpui_docking = { workspace = true, features = ["test-support"] }
open_gpui_windows = { workspace = true, features = ["test-support"] }
raw-window-handle = "0.6"
windows.workspace = true

[lints]
workspace = true
