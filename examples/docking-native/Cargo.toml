[package]
name = "open-gpui-docking-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
publish = false
description = "Native docking smoke example for Open GPUI."

[[bin]]
name = "open-gpui-docking-native"
path = "src/main.rs"

[dependencies]
env_logger.workspace = true
log.workspace = true
open_gpui.workspace = true
open_gpui_devtools = { workspace = true, features = ["docking"] }
open_gpui_docking.workspace = true
open_gpui_platform = { workspace = true, features = ["font-kit"] }

[dev-dependencies]
open_gpui = { workspace = true, features = ["test-support"] }
serde_json.workspace = true

[lints]
workspace = true
