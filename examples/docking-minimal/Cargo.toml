[package]
name = "open-gpui-docking-minimal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
publish = false
description = "Minimal single-window docking example for Open GPUI."

[[bin]]
name = "open-gpui-docking-minimal"
path = "src/main.rs"

[dependencies]
open_gpui.workspace = true
open_gpui_docking.workspace = true
open_gpui_platform = { workspace = true, features = ["font-kit"] }

[dev-dependencies]
open_gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
